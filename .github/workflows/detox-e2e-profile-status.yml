name: Detox E2E profile status

on:
  workflow_call:
    inputs:
      profile: { required: true, type: string }
      run_profile: { required: true, type: boolean }
      path_selection_failed: { required: true, type: boolean }
      execution_result: { required: true, type: string }

permissions:
  contents: read

jobs:
  profile_status:
    # A skipped job does not resolve this reusable-workflow input in its required check name.
    name: Detox ${{ inputs.profile }} iOS E2E
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if changed-path selection was unavailable
        if: ${{ inputs.path_selection_failed }}
        run: |
          echo "::error::Changed-path selection failed; refusing to skip this required E2E check."
          exit 1
      - name: Propagate selected profile failure
        if: ${{ inputs.run_profile && inputs.execution_result != 'success' && !inputs.path_selection_failed }}
        run: |
          echo "::error::The selected Detox profile did not complete successfully."
          exit 1
      - name: Record unselected profile
        if: ${{ !inputs.run_profile && !inputs.path_selection_failed }}
        env:
          E2E_PROFILE: ${{ inputs.profile }}
          PROFILE_EXECUTION_RESULT: ${{ inputs.execution_result }}
        run: |
          {
            echo "This required check passed because the path selector did not select this profile."
            echo "Profile: \`$E2E_PROFILE\`."
            echo "Profile execution result: \`$PROFILE_EXECUTION_RESULT\`."
            echo "No iOS build or Detox test steps ran for this profile."
          } >> "$GITHUB_STEP_SUMMARY"
