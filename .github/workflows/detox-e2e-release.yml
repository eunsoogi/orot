name: Release shards

on:
  workflow_call:
    inputs:
      fingerprints:
        description: Shared source and build fingerprints from the profile workflow.
        required: true
        type: string
      trace_logging:
        description: Enable Detox trace logging for manual diagnostics.
        required: false
        type: boolean
        default: false
      resource_sampling:
        description: Collect bounded process and memory samples for manual diagnostics.
        required: false
        type: boolean
        default: false
      run_profile: { required: false, type: boolean, default: true }
      path_selection_failed: { required: false, type: boolean, default: false }

permissions:
  contents: read

jobs:
  # The required status jobs keep static shard names while profile runners skip irrelevant paths.
  produce_release_app:
    name: Produce shared Release app artifact
    if: ${{ inputs.run_profile && !inputs.path_selection_failed }}
    uses: ./.github/workflows/detox-e2e-profile-app-producer.yml
    with:
      profile: release
      fingerprints: ${{ inputs.fingerprints }}

  run_detox_release_ui_shard:
    name: Execute Release UI and storage profile
    needs: [produce_release_app]
    if: ${{ always() && inputs.run_profile }}
    uses: ./.github/workflows/detox-e2e-profile.yml
    with:
      profile: release
      release_shard: release-e2e.test.js
      fingerprints: ${{ inputs.fingerprints }}
      app_artifact: ${{ toJSON(needs.produce_release_app.outputs) }}
      trace_logging: ${{ inputs.trace_logging }}
      resource_sampling: ${{ inputs.resource_sampling }}
      run_profile: ${{ inputs.run_profile }}
      path_selection_failed: ${{ inputs.path_selection_failed }}

  detox_release_ui_shard:
    name: Release UI and storage
    needs: [run_detox_release_ui_shard]
    if: ${{ always() }}
    uses: ./.github/workflows/detox-e2e-profile-status.yml
    with:
      profile: release
      run_profile: ${{ inputs.run_profile }}
      path_selection_failed: ${{ inputs.path_selection_failed }}
      execution_result: ${{ needs.run_detox_release_ui_shard.result }}

  run_detox_release_data_shard:
    name: Execute Release stateful-data profile
    needs: [produce_release_app]
    if: ${{ always() && inputs.run_profile }}
    uses: ./.github/workflows/detox-e2e-profile.yml
    with:
      profile: release
      release_shard: release-e2e-data.test.js
      fingerprints: ${{ inputs.fingerprints }}
      app_artifact: ${{ toJSON(needs.produce_release_app.outputs) }}
      trace_logging: ${{ inputs.trace_logging }}
      resource_sampling: ${{ inputs.resource_sampling }}
      run_profile: ${{ inputs.run_profile }}
      path_selection_failed: ${{ inputs.path_selection_failed }}

  detox_release_data_shard:
    name: Release stateful-data
    needs: [run_detox_release_data_shard]
    if: ${{ always() }}
    uses: ./.github/workflows/detox-e2e-profile-status.yml
    with:
      profile: release
      run_profile: ${{ inputs.run_profile }}
      path_selection_failed: ${{ inputs.path_selection_failed }}
      execution_result: ${{ needs.run_detox_release_data_shard.result }}
