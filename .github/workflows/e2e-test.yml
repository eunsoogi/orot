name: E2E Test
on:
  pull_request:
    # Drafts already validate source events; status-only transitions reuse the same head's checks.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  # The selected entry shares this allocation window; the dedicated manager cancels stale PR runs.
  group: ios-ci-macos-${{ github.repository }}
  cancel-in-progress: false
jobs:
  selection:
    name: Plan / Select
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      complete: ${{ steps.select.outputs.selection_complete }}
      deferred: ${{ steps.select.outputs.full_validation_deferred }}
      run_ios: ${{ steps.select.outputs.selection_complete != 'true' || steps.select.outputs.ios_build == 'true' || steps.select.outputs.ios_tests == 'true' }}
      # Reject an unsupported manual event without allowing it to attest full validation.
      diagnostic: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # A PR comparison needs its base history; incomplete selection must not bypass required checks.
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .nvmrc }
      - id: select
        run: node scripts/ci/select-changed-paths.mjs
  plan:
    name: Plan / Coverage
    needs: selection
    if: ${{ always() && !cancelled() && github.event_name != 'workflow_dispatch' && needs.selection.outputs.run_ios == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .nvmrc }
      - name: Validate all independent feature suites before Mac allocation
        id: plan
        run: node scripts/ci/ios-test-cohort-plan-cli.mjs
  production_validation:
    name: Build
    needs: plan
    uses: ./.github/workflows/ios-production-validation.yml
  oauth_products:
    name: Build
    needs: plan
    uses: ./.github/workflows/ios-oauth-build.yml
  oauth_execution:
    name: Test
    needs: oauth_products
    uses: ./.github/workflows/ios-oauth-execution.yml
    with:
      archive_digest: ${{ needs.oauth_products.outputs.archive_digest }}
      manifest_digest: ${{ needs.oauth_products.outputs.manifest_digest }}
  debug_products:
    name: Build
    needs: plan
    uses: ./.github/workflows/ios-test-products-build.yml
    with:
      name: Debug
      profile: provider-data
      artifact_name: ios-test-debug-products
      timeout_minutes: 60
  release_products:
    name: Build
    needs: plan
    uses: ./.github/workflows/ios-test-products-build.yml
    with:
      name: Release
      profile: core
      artifact_name: ios-test-release-products
      timeout_minutes: 60
  debug_execution:
    name: Test
    needs: [plan, debug_products]
    uses: ./.github/workflows/ios-debug-tests.yml
    with:
      archive_digest: ${{ needs.debug_products.outputs.archive_digest }}
      manifest_digest: ${{ needs.debug_products.outputs.manifest_digest }}
  release_execution:
    name: Test
    needs: [plan, release_products]
    uses: ./.github/workflows/ios-release-tests.yml
    with:
      archive_digest: ${{ needs.release_products.outputs.archive_digest }}
      manifest_digest: ${{ needs.release_products.outputs.manifest_digest }}
  completeness:
    name: Validate
    needs:
      [
        plan,
        production_validation,
        oauth_products,
        oauth_execution,
        debug_products,
        release_products,
        debug_execution,
        release_execution,
      ]
    if: ${{ always() && needs.plan.result != 'skipped' }}
    uses: ./.github/workflows/ios-test-completeness.yml
    with:
      execution_results: ${{ toJSON(needs) }}
  ios_simulator_build:
    name: Validate / Build
    needs: [selection, completeness]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require full current-head selection
        env:
          COMPLETE: ${{ needs.selection.outputs.complete }}
          DEFERRED: ${{ needs.selection.outputs.run_ios == 'true' && needs.selection.outputs.deferred == 'true' && needs.completeness.result != 'success' }}
          DIAGNOSTIC: ${{ needs.selection.outputs.diagnostic }}
        run: test "$COMPLETE" = true && test "$DEFERRED" != true && test "$DIAGNOSTIC" != true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .nvmrc }
      - name: Read the completed production build receipt
        if: needs.selection.outputs.run_ios == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-production-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-receipt
      - name: Read the separate OAuth execution receipt
        if: needs.selection.outputs.run_ios == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-oauth-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/oauth-receipt
      - name: Verify production receipt at this run and head
        if: needs.selection.outputs.run_ios == 'true'
        run: node scripts/ci/ios-production-receipt.mjs verify artifacts/production-receipt/production-receipt.json artifacts/oauth-receipt/products/receipt.json
  required_statuses:
    # Selected iOS paths require full validation; complete exclusions also pass for drafts.
    name: Validate
    needs: [selection, completeness]
    if: always()
    uses: ./.github/workflows/ios-required-statuses.yml
    with:
      selected: ${{ needs.selection.outputs.run_ios == 'true' }}
      invalid_selection: ${{ needs.selection.outputs.complete != 'true' || (needs.selection.outputs.run_ios == 'true' && needs.selection.outputs.deferred == 'true' && needs.completeness.result != 'success') || needs.selection.outputs.diagnostic == 'true' || github.event_name == 'workflow_dispatch' }}
      execution_result: ${{ needs.completeness.result }}
