name: E2E
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      focus_pr_number: { type: string, default: '' }
      focus_profile: { type: string, default: '' }
      focus_scenario_file: { type: string, default: '' }
      focus_scenario_name: { type: string, default: '' }
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  selection:
    name: E2E / Plan / Select
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      complete: ${{ steps.select.outputs.selection_complete }}
      deferred: ${{ steps.select.outputs.full_validation_deferred }}
      run_ios: ${{ steps.select.outputs.selection_complete != 'true' || steps.select.outputs.ios_build == 'true' || steps.select.outputs.ios_tests == 'true' }}
      focused: ${{ github.event_name == 'workflow_dispatch' && (inputs.focus_pr_number != '' || inputs.focus_profile != '' || inputs.focus_scenario_file != '' || inputs.focus_scenario_name != '') }}
      diagnostic: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # A PR comparison needs its base history; incomplete selection must not bypass required checks.
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .nvmrc }
      - id: select
        run: node scripts/ci/select-changed-paths.mjs
  ios_validation:
    name: E2E
    needs: selection
    # PR updates, including drafts, and pushes start full validation automatically. Manual entry remains diagnostic-only.
    if: ${{ always() && !cancelled() && github.event_name != 'workflow_dispatch' && needs.selection.outputs.focused != 'true' && needs.selection.outputs.run_ios == 'true' }}
    uses: ./.github/workflows/ios-test-validation.yml
  ios_simulator_build:
    name: E2E / Validate / Build
    needs: [selection, ios_validation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require full current-head selection
        env:
          COMPLETE: ${{ needs.selection.outputs.complete }}
          DEFERRED: ${{ needs.selection.outputs.deferred == 'true' && needs.ios_validation.result != 'success' }}
          DIAGNOSTIC: ${{ needs.selection.outputs.diagnostic }}
        run: test "$COMPLETE" = true && test "$DEFERRED" != true && test "$DIAGNOSTIC" != true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .nvmrc }
      - name: Read the completed production build receipt
        if: needs.selection.outputs.run_ios == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-production-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-receipt
      - name: Read the separate OAuth execution receipt
        if: needs.selection.outputs.run_ios == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-oauth-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/oauth-receipt
      - name: Verify production receipt at this run and head
        if: needs.selection.outputs.run_ios == 'true'
        run: node scripts/ci/ios-production-receipt.mjs verify artifacts/production-receipt/production-receipt.json artifacts/oauth-receipt/products/receipt.json
  required_statuses:
    # These five domain checks require the same complete current-head validation.
    name: E2E / Validate
    needs: [selection, ios_validation]
    if: always()
    uses: ./.github/workflows/ios-required-statuses.yml
    with:
      selected: ${{ needs.selection.outputs.run_ios == 'true' }}
      invalid_selection: ${{ needs.selection.outputs.complete != 'true' || (needs.selection.outputs.deferred == 'true' && needs.ios_validation.result != 'success') || needs.selection.outputs.diagnostic == 'true' || github.event_name == 'workflow_dispatch' }}
      execution_result: ${{ needs.ios_validation.result }}
  focused_scenario:
    name: E2E / Focus
    needs: selection
    if: ${{ github.event_name == 'workflow_dispatch' && needs.selection.outputs.focused == 'true' }}
    uses: ./.github/workflows/ios-focused.yml
    with:
      pr_number: ${{ inputs.focus_pr_number }}
      profile: ${{ inputs.focus_profile }}
      scenario_file: ${{ inputs.focus_scenario_file }}
      scenario_name: ${{ inputs.focus_scenario_name }}
