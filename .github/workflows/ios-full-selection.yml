name: Full integration selection
on:
  workflow_call:
    outputs:
      complete: { value: '${{ jobs.selection.outputs.complete }}' }
      deferred: { value: '${{ jobs.selection.outputs.deferred }}' }
      validation_tier: { value: '${{ jobs.selection.outputs.validation_tier }}' }
      ios_test_cohorts: { value: '${{ jobs.selection.outputs.ios_test_cohorts }}' }
      ios_oauth: { value: '${{ jobs.selection.outputs.ios_oauth }}' }
      metadata_only_edit: { value: '${{ jobs.selection.outputs.metadata_only_edit }}' }
      run_ios: { value: '${{ jobs.selection.outputs.run_ios }}' }
      diagnostic: { value: '${{ jobs.selection.outputs.diagnostic }}' }
      non_protected_contexts: { value: '${{ jobs.selection.outputs.non_protected_contexts }}' }
permissions: { contents: read }
jobs:
  selection:
    name: Select
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      complete: ${{ steps.select.outputs.selection_complete }}
      deferred: ${{ steps.select.outputs.full_validation_deferred }}
      validation_tier: ${{ steps.select.outputs.validation_tier }}
      ios_test_cohorts: ${{ steps.select.outputs.ios_test_cohorts }}
      ios_oauth: ${{ steps.select.outputs.ios_oauth }}
      metadata_only_edit: ${{ steps.select.outputs.metadata_only_edit }}
      # Only complete Full selection on main, from schedule or manual dispatch, can allocate macOS jobs.
      run_ios: ${{ steps.select.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.select.outputs.validation_tier == 'full' && steps.select.outputs.selection_complete == 'true' }}
      diagnostic: false
      non_protected_contexts: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .nvmrc }
      - id: select
        uses: ./.github/actions/ios-e2e-selection
