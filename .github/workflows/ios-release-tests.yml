name: Release integration tests
on:
  workflow_call:
    inputs:
      # One producer prefix selects products; each consumer still verifies the supplied content digests.
      artifact_name: { type: string, default: ios-test-release-products }
      archive_digest: { required: true, type: string }
      manifest_digest: { required: true, type: string }
      cohorts: { required: true, type: string }
permissions: { contents: read }
env:
  CI: 'true'
  TZ: UTC
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  EXPECTED_NODE_VERSION: '22.23.2'
jobs:
  # Cohort conditions avoid Mac allocations while each selected job retains its complete stateful driver.
  core_integration:
    name: Core
    if: ${{ contains(fromJSON(inputs.cohorts), 'core-integration') }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Disable and verify Spotlight
        uses: ./.github/actions/ios-host-bootstrap
        with: { log_directory: artifacts/ios-cohort }
      - uses: ./.github/actions/ios-test-cohort-executor
        with:
          cohort: core-integration
          artifact_name: ${{ inputs.artifact_name }}
          profile: core
          archive_digest: ${{ inputs.archive_digest }}
          manifest_digest: ${{ inputs.manifest_digest }}
      - name: Preserve setup diagnostics
        if: always()
        uses: ./.github/actions/ios-test-cohort-diagnostics
        with: { cohort: core-integration }
  core_ui:
    name: UI
    if: ${{ contains(fromJSON(inputs.cohorts), 'core-ui') }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Disable and verify Spotlight
        uses: ./.github/actions/ios-host-bootstrap
        with: { log_directory: artifacts/ios-cohort }
      - uses: ./.github/actions/ios-test-cohort-executor
        with:
          cohort: core-ui
          artifact_name: ${{ inputs.artifact_name }}
          profile: core
          archive_digest: ${{ inputs.archive_digest }}
          manifest_digest: ${{ inputs.manifest_digest }}
      - name: Preserve setup diagnostics
        if: always()
        uses: ./.github/actions/ios-test-cohort-diagnostics
        with: { cohort: core-ui }
  recording_evidence:
    name: Recording evidence
    if: ${{ contains(fromJSON(inputs.cohorts), 'recording-evidence') }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Disable and verify Spotlight
        uses: ./.github/actions/ios-host-bootstrap
        with: { log_directory: artifacts/ios-cohort }
      - uses: ./.github/actions/ios-test-cohort-executor
        with:
          cohort: recording-evidence
          artifact_name: ${{ inputs.artifact_name }}
          profile: core
          archive_digest: ${{ inputs.archive_digest }}
          manifest_digest: ${{ inputs.manifest_digest }}
      - name: Preserve setup diagnostics
        if: always()
        uses: ./.github/actions/ios-test-cohort-diagnostics
        with: { cohort: recording-evidence }
  persistence:
    name: Persistence
    if: ${{ contains(fromJSON(inputs.cohorts), 'persistence') }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Disable and verify Spotlight
        uses: ./.github/actions/ios-host-bootstrap
        with: { log_directory: artifacts/ios-cohort }
      - uses: ./.github/actions/ios-test-cohort-executor
        with:
          cohort: persistence
          artifact_name: ${{ inputs.artifact_name }}
          profile: core
          archive_digest: ${{ inputs.archive_digest }}
          manifest_digest: ${{ inputs.manifest_digest }}
      - name: Preserve setup diagnostics
        if: always()
