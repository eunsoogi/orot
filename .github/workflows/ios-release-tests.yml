      - name: Preserve setup diagnostics
        if: always()
        uses: ./.github/actions/ios-test-cohort-diagnostics
        with: { cohort: isolation }
  backup:
    name: Backup
    if: ${{ contains(fromJSON(inputs.cohorts), 'backup') }}
    runs-on: xcode-27
    timeout-minutes: 20
