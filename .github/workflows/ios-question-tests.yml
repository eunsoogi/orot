name: Question integration tests
on:
  workflow_call:
    inputs:
      # One producer prefix selects products; each consumer still verifies the supplied content digests.
      artifact_name: { type: string, default: ios-test-release-products }
      archive_digest: { required: true, type: string }
      manifest_digest: { required: true, type: string }
      cohorts: { required: true, type: string }
permissions: { contents: read }
env:
  CI: 'true'
  TZ: UTC
  # Pin the named bundle because the hosted image default can change between releases.
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  EXPECTED_NODE_VERSION: '22.23.2'
jobs:
  questions_review:
    name: Review
    if: ${{ contains(fromJSON(inputs.cohorts), 'questions-review') }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Disable and verify Spotlight
        uses: ./.github/actions/ios-host-bootstrap
        with: { log_directory: artifacts/ios-cohort }
      - uses: ./.github/actions/ios-test-cohort-executor
        with:
          cohort: questions-review
          artifact_name: ${{ inputs.artifact_name }}
          profile: fixtures
          archive_digest: ${{ inputs.archive_digest }}
          manifest_digest: ${{ inputs.manifest_digest }}
      - name: Preserve setup diagnostics
        if: always()
        uses: ./.github/actions/ios-test-cohort-diagnostics
        with: { cohort: questions-review }
  questions_conversation:
    name: Conversation
    if: ${{ contains(fromJSON(inputs.cohorts), 'questions-conversation') }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Disable and verify Spotlight
        uses: ./.github/actions/ios-host-bootstrap
        with: { log_directory: artifacts/ios-cohort }
      - uses: ./.github/actions/ios-test-cohort-executor
        with:
          cohort: questions-conversation
          artifact_name: ${{ inputs.artifact_name }}
          profile: fixtures
          archive_digest: ${{ inputs.archive_digest }}
          manifest_digest: ${{ inputs.manifest_digest }}
      - name: Preserve setup diagnostics
        if: always()
        uses: ./.github/actions/ios-test-cohort-diagnostics
        with: { cohort: questions-conversation }
  # Schedule complete accessibility methods independently of the composer journey.
  questions_accessibility:
    name: Accessibility
    if: ${{ contains(fromJSON(inputs.cohorts), 'questions-accessibility') }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Disable and verify Spotlight
        uses: ./.github/actions/ios-host-bootstrap
        with: { log_directory: artifacts/ios-cohort }
      - uses: ./.github/actions/ios-test-cohort-executor
        with:
          cohort: questions-accessibility
          artifact_name: ${{ inputs.artifact_name }}
          profile: fixtures
          archive_digest: ${{ inputs.archive_digest }}
          manifest_digest: ${{ inputs.manifest_digest }}
      - name: Preserve setup diagnostics
        if: always()
        uses: ./.github/actions/ios-test-cohort-diagnostics
        with: { cohort: questions-accessibility }
  questions_summary:
    name: Summary
    if: ${{ contains(fromJSON(inputs.cohorts), 'questions-summary') }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Disable and verify Spotlight
        uses: ./.github/actions/ios-host-bootstrap
        with: { log_directory: artifacts/ios-cohort }
      - uses: ./.github/actions/ios-test-cohort-executor
        with:
          cohort: questions-summary
          artifact_name: ${{ inputs.artifact_name }}
          profile: fixtures
          archive_digest: ${{ inputs.archive_digest }}
          manifest_digest: ${{ inputs.manifest_digest }}
      - name: Preserve setup diagnostics
        if: always()
        uses: ./.github/actions/ios-test-cohort-diagnostics
        with: { cohort: questions-summary }
