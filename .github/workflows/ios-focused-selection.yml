name: Focused integration selection
on:
  workflow_call:
    inputs:
      profile: { required: true, type: string }
      scenario_file: { required: true, type: string }
      scenario_name: { required: true, type: string }
    outputs:
      profile: { value: '${{ jobs.selection.outputs.profile }}' }
      configuration: { value: '${{ jobs.selection.outputs.configuration }}' }
      mode: { value: '${{ jobs.selection.outputs.mode }}' }
      suite: { value: '${{ jobs.selection.outputs.suite }}' }
      identifier: { value: '${{ jobs.selection.outputs.identifier }}' }
      prepare_ui: { value: '${{ jobs.selection.outputs.prepare_ui }}' }
      fixture_suite: { value: '${{ jobs.selection.outputs.fixture_suite }}' }
      cohorts: { value: '${{ jobs.selection.outputs.cohorts }}' }
permissions: { contents: read }
jobs:
  selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.selection.outputs.profile }}
      configuration: ${{ steps.selection.outputs.configuration }}
      mode: ${{ steps.selection.outputs.mode }}
      suite: ${{ steps.selection.outputs.suite }}
      identifier: ${{ steps.selection.outputs.identifier }}
      prepare_ui: ${{ steps.selection.outputs.prepareUi }}
      fixture_suite: ${{ steps.selection.outputs.fixtureSuite }}
      cohorts: ${{ steps.selection.outputs.cohorts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .nvmrc }
      - name: Bind the actual head and exact selection before Mac allocation
        id: selection
        env:
          PROFILE: ${{ inputs.profile }}
          SOURCE_FILE: ${{ inputs.scenario_file }}
          TEST_ID: ${{ inputs.scenario_name }}
        run: node scripts/ci/ios-focused-selection-cli.mjs "$PROFILE" "$SOURCE_FILE" "$TEST_ID"
