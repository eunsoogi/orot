name: Build one native product configuration

on:
  workflow_call:
    inputs:
      profile: { required: true, type: string }
      artifact_name: { required: true, type: string }
      production_build: { required: false, type: boolean, default: false }
    outputs:
      archive_digest:
        value: ${{ jobs.products.outputs.archive_digest }}
      manifest_digest:
        value: ${{ jobs.products.outputs.manifest_digest }}

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  EXPECTED_NODE_VERSION: '22.23.2'

jobs:
  products:
    name: Build ${{ inputs.profile }} compatible native products
    runs-on: xcode-27
    # Production and native builds retain separate flags/outputs within the sum of their previous build allowances.
    timeout-minutes: ${{ inputs.production_build && 120 || 60 }}
    outputs:
      archive_digest: ${{ steps.build.outputs.archive_digest }}
      manifest_digest: ${{ steps.build.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ios-test-products-build
        id: build
        with:
          profile: ${{ inputs.profile }}
          production_build: ${{ inputs.production_build }}
      - name: Upload the verified configuration products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native-focus/product-artifact
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_name }}-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/native-focus/*.log
            artifacts/native-focus/*.jsonl
            artifacts/native-focus/DerivedData/Build/Products/*.xctestrun
          if-no-files-found: warn
          retention-days: 7
