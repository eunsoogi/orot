name: Focused E2E diagnostic routing

on:
  workflow_call:
    inputs:
      pr_number: { required: false, type: string, default: '' }
      profile: { required: true, type: string }
      scenario_file: { required: true, type: string }
      scenario_name: { required: true, type: string }

permissions:
  contents: read
  pull-requests: read

jobs:
  legacy_focus:
    if: ${{ !startsWith(inputs.profile, 'native/') }}
    uses: ./.github/workflows/detox-e2e-focused.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      profile: ${{ inputs.profile }}
      scenario_file: ${{ inputs.scenario_file }}
      scenario_name: ${{ inputs.scenario_name }}
  native_focus:
    if: ${{ startsWith(inputs.profile, 'native/') }}
    uses: ./.github/workflows/ios-native-focused.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      profile: ${{ inputs.profile }}
      scenario_file: ${{ inputs.scenario_file }}
      scenario_name: ${{ inputs.scenario_name }}
