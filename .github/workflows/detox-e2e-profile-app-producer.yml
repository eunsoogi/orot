name: Build reusable Detox profile app

on:
  workflow_call:
    inputs:
      profile:
        description: The isolated iOS Simulator profile to build.
        required: true
        type: string
      fingerprints:
        description: Shared source and native dependency fingerprints for the caller's commit.
        required: true
        type: string
    outputs:
      artifact_name:
        description: Immutable artifact name for this run and attempt.
        value: ${{ jobs.produce_profile_app.outputs.artifact_name }}
      archive_sha256:
        description: Digest of the verified app archive.
        value: ${{ jobs.produce_profile_app.outputs.archive_sha256 }}
      manifest_sha256:
        description: Digest of the verified app manifest.
        value: ${{ jobs.produce_profile_app.outputs.manifest_sha256 }}

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  DETOX_APP_PROFILE: ${{ inputs.profile }}
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  EXPECTED_NODE_VERSION: '22.23.2'
  EXPECTED_PNPM_VERSION: '12.3.4'
  EXPECTED_RUBY_VERSION: '4.0.7'
  EXPECTED_COCOAPODS_VERSION: '1.17.0'
  EXPECTED_APPLESIMUTILS_VERSION: '0.9.12'
  EXPECTED_XCODE_VERSION: '27.0'
  EXPECTED_IOS_SIMULATOR_SDK: '27.0'
  EXPECTED_IOS_SIMULATOR_RUNTIME_NAME: ${{ inputs.profile == 'transcription' && 'iOS 26.2' || 'iOS 27.0' }}
  EXPECTED_IOS_SIMULATOR_RUNTIME_IDENTIFIER: ${{ inputs.profile == 'transcription' && 'com.apple.CoreSimulator.SimRuntime.iOS-26-2' || 'com.apple.CoreSimulator.SimRuntime.iOS-27-0' }}
  EXPECTED_DETOX_SIMULATOR_DEVICE_NAME: ${{ inputs.profile == 'transcription' && 'iPhone SE (3rd generation)' || 'iPhone 18 Pro' }}
  EXPECTED_DETOX_SIMULATOR_DEVICE_TYPE_ID: ${{ inputs.profile == 'transcription' && 'com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation' || 'com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro' }}
  DETOX_CACHE_RUNTIME_SUFFIX: ${{ inputs.profile == 'transcription' && '-runtime-ios26.2-build23C54-device-iphonese3' || '' }}

jobs:
  produce_profile_app:
    name: Produce verified ${{ inputs.profile }} app artifact
    runs-on: xcode-27
    timeout-minutes: 75
    outputs:
      artifact_name: ${{ steps.artifact_name.outputs.name }}
      archive_sha256: ${{ steps.create_profile_artifact.outputs.app_archive_sha256 }}
      manifest_sha256: ${{ steps.create_profile_artifact.outputs.app_manifest_sha256 }}
    steps:
      - name: Validate supported artifact profile
        env:
          DETOX_APP_PROFILE: ${{ inputs.profile }}
        run: |
          case "$DETOX_APP_PROFILE" in
            release | transcription) ;;
            *) echo "::error::Unsupported app artifact profile."; exit 2 ;;
          esac
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify runner toolchain
        id: verify_toolchain
        # Provision profile-specific runtime assets before validating the custom runner image.
        timeout-minutes: 20
        run: bash scripts/ci/prepare-detox-runtime.sh "$DETOX_APP_PROFILE" && scripts/ci/verify-toolchain.sh
      - name: Install dependencies and start build-input scan
        timeout-minutes: 15
        run: scripts/ci/run-command.sh install artifacts/detox/install.log -- scripts/ci/install-detox-profile-dependencies.sh "$DETOX_APP_PROFILE"
      - name: Resolve shared cache fingerprints
        id: resolve_fingerprints
        env:
          DETOX_SHARED_FINGERPRINTS_JSON: ${{ inputs.fingerprints }}
        run: node scripts/ci/detox-cache-fingerprint-cli.mjs --resolve-shared-derived-data-only
      - name: Restore profile app product and Detox runtime cache
        id: profile_derived_data_cache
        timeout-minutes: 10
        uses: ./.github/actions/detox-profile-app-cache/restore
        with:
          profile: ${{ inputs.profile }}
          fingerprints: ${{ steps.resolve_fingerprints.outputs.fingerprints }}
          key: orot-detox-app-product-v10-${{ runner.os }}-${{ runner.arch }}-macos-${{ steps.verify_toolchain.outputs.macos_version }}-node-${{ env.EXPECTED_NODE_VERSION }}-pnpm-${{ env.EXPECTED_PNPM_VERSION }}-ruby-${{ env.EXPECTED_RUBY_VERSION }}-cocoapods-${{ env.EXPECTED_COCOAPODS_VERSION }}-xcode-${{ env.EXPECTED_XCODE_VERSION }}-build-${{ steps.verify_toolchain.outputs.xcodebuild_fingerprint }}-sdk-${{ env.EXPECTED_IOS_SIMULATOR_SDK }}-${{ inputs.profile }}${{ env.DETOX_CACHE_RUNTIME_SUFFIX }}-native-${{ steps.resolve_fingerprints.outputs.native_dependencies }}-build-${{ steps.resolve_fingerprints.outputs.build_inputs }}
          restore_keys: >-
            orot-detox-app-product-v10-${{ runner.os }}-${{ runner.arch }}-macos-${{ steps.verify_toolchain.outputs.macos_version }}-node-${{ env.EXPECTED_NODE_VERSION }}-pnpm-${{ env.EXPECTED_PNPM_VERSION }}-ruby-${{ env.EXPECTED_RUBY_VERSION }}-cocoapods-${{ env.EXPECTED_COCOAPODS_VERSION }}-xcode-${{ env.EXPECTED_XCODE_VERSION }}-build-${{ steps.verify_toolchain.outputs.xcodebuild_fingerprint }}-sdk-${{ env.EXPECTED_IOS_SIMULATOR_SDK }}-${{ inputs.profile }}${{ env.DETOX_CACHE_RUNTIME_SUFFIX }}-native-${{ steps.resolve_fingerprints.outputs.native_dependencies }}-
      - name: Prepare restored profile DerivedData cache
        id: prepare_derived_data_cache
        timeout-minutes: 5
        env:
          DETOX_CACHE_RUNNER_OS: ${{ runner.os }}
          DETOX_CACHE_RUNNER_ARCH: ${{ runner.arch }}
          MACOS_VERSION: ${{ steps.verify_toolchain.outputs.macos_version }}
          EXPECTED_XCODE_VERSION: ${{ env.EXPECTED_XCODE_VERSION }}
          EXPECTED_IOS_SIMULATOR_SDK: ${{ env.EXPECTED_IOS_SIMULATOR_SDK }}
        run: node scripts/ci/detox-derived-data-cache.mjs prepare "$DETOX_APP_PROFILE"
      - name: Cache Detox framework outputs
        id: detox_framework_cache
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        timeout-minutes: 10
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/Library/Detox/ios/framework
            ~/Library/Detox/ios/xcuitest-runner
          key: orot-detox-framework-v1-${{ runner.os }}-${{ runner.arch }}-macos-${{ steps.verify_toolchain.outputs.macos_version }}-xcode-${{ steps.verify_toolchain.outputs.xcodebuild_fingerprint }}-lock-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build Detox iOS framework cache
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' && steps.detox_framework_cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 20
        run: scripts/ci/run-command.sh detox-framework-cache artifacts/detox/framework-cache.log -- pnpm --filter @orot/mobile exec -- detox build-framework-cache
      - name: Prepare React Native artifact cache fingerprint
        id: rn_artifact_fingerprint
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        env:
          PNPM_LOCKFILE_HASH: ${{ hashFiles('pnpm-lock.yaml') }}
          PODFILE_LOCK_HASH: ${{ hashFiles('apps/mobile/ios/Podfile.lock') }}
        run: scripts/ci/prepare-rn-artifact-fingerprint.sh
      - name: Cache React Native artifact archives
        id: rn_artifact_cache
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        timeout-minutes: 10
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/ReactNative
          key: orot-rn-ios-artifacts-v3-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.EXPECTED_XCODE_VERSION }}-sdk-${{ env.EXPECTED_IOS_SIMULATOR_SDK }}-${{ inputs.profile }}-${{ steps.rn_artifact_fingerprint.outputs.fingerprint }}
      - name: Set up Ruby
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '4.0.7'
          bundler-cache: false
      - name: Cache Detox CocoaPods intermediates
        id: cocoapods_cache
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        uses: ./.github/actions/detox-cocoapods-cache
        with:
          cache-context: >-
            ${{ runner.os }}-${{ runner.arch }}-macos-${{ steps.verify_toolchain.outputs.macos_version }}-node-${{ env.EXPECTED_NODE_VERSION }}-pnpm-${{ env.EXPECTED_PNPM_VERSION }}-ruby-${{ env.EXPECTED_RUBY_VERSION }}-cocoapods-${{ env.EXPECTED_COCOAPODS_VERSION }}-xcode-${{ env.EXPECTED_XCODE_VERSION }}-sdk-${{ env.EXPECTED_IOS_SIMULATOR_SDK }}${{ env.DETOX_CACHE_RUNTIME_SUFFIX }}
      - name: Install CocoaPods
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        run: scripts/ci/run-command.sh cocoapods-install artifacts/detox/cocoapods-install.log -- gem install cocoapods --version "${EXPECTED_COCOAPODS_VERSION}" --no-document
      - name: Install Detox CocoaPods dependencies
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        timeout-minutes: 20
        run: bash scripts/ci/install-detox-cocoapods.sh
      - name: Build Detox profile app
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        timeout-minutes: 45
        run: scripts/ci/run-command.sh detox-build artifacts/detox/build.log -- bash scripts/ci/build-detox-apps.sh "$DETOX_APP_PROFILE" --skip-pods
      - name: Write validated profile DerivedData cache manifest
        id: write_derived_data_cache
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        timeout-minutes: 5
        env:
          DETOX_CACHE_RUNNER_OS: ${{ runner.os }}
          DETOX_CACHE_RUNNER_ARCH: ${{ runner.arch }}
          EXPECTED_DETOX_BUILD_INPUT_FINGERPRINT: ${{ steps.profile_derived_data_cache.outputs.build_inputs }}
          EXPECTED_DETOX_NATIVE_DEPENDENCY_FINGERPRINT: ${{ steps.profile_derived_data_cache.outputs.native_dependencies }}
          EXPECTED_PRIVACY_MANIFEST_INPUT_SHA256: ${{ steps.profile_derived_data_cache.outputs.privacy_manifest_input_sha256 }}
          MACOS_VERSION: ${{ steps.verify_toolchain.outputs.macos_version }}
          EXPECTED_XCODE_VERSION: ${{ env.EXPECTED_XCODE_VERSION }}
          EXPECTED_IOS_SIMULATOR_SDK: ${{ env.EXPECTED_IOS_SIMULATOR_SDK }}
        run: node scripts/ci/detox-derived-data-cache.mjs write "$DETOX_APP_PROFILE"
      - name: Save validated profile app product
        timeout-minutes: 10
        uses: ./.github/actions/detox-profile-app-cache/save
        with:
          profile: ${{ inputs.profile }}
          key: ${{ steps.profile_derived_data_cache.outputs.cache-hit != 'true' && steps.write_derived_data_cache.outcome == 'success' && steps.profile_derived_data_cache.outputs.cache-primary-key || '' }}
      - name: Create run-bound profile app artifact
        id: create_profile_artifact
        timeout-minutes: 15
        env:
          DETOX_CACHE_RUNNER_OS: ${{ runner.os }}
          DETOX_CACHE_RUNNER_ARCH: ${{ runner.arch }}
          XCODEBUILD_FINGERPRINT: ${{ steps.verify_toolchain.outputs.xcodebuild_fingerprint }}
          EXPECTED_DETOX_BUILD_INPUT_FINGERPRINT: ${{ steps.resolve_fingerprints.outputs.build_inputs }}
          EXPECTED_DETOX_NATIVE_DEPENDENCY_FINGERPRINT: ${{ steps.resolve_fingerprints.outputs.native_dependencies }}
          EXPECTED_XCODE_VERSION: ${{ env.EXPECTED_XCODE_VERSION }}
          EXPECTED_IOS_SIMULATOR_SDK: ${{ env.EXPECTED_IOS_SIMULATOR_SDK }}
        run: node scripts/ci/detox-profile-app-artifact.mjs create "$DETOX_APP_PROFILE" "artifacts/detox/$DETOX_APP_PROFILE-app"
      - name: Name run-bound profile artifact
        id: artifact_name
        env:
          PROFILE_APP_ARTIFACT_NAME: orot-detox-${{ inputs.profile }}-app-${{ github.run_id }}-${{ github.run_attempt }}
        run: echo "name=${PROFILE_APP_ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
      - name: Upload run-bound profile app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orot-detox-${{ inputs.profile }}-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/detox/${{ inputs.profile }}-app/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
