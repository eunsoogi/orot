name: Focused Detox scenario

on:
  workflow_call:
    inputs:
      pr_number:
        description: Open pull request number whose current head will be validated.
        required: true
        type: string
      profile:
        description: E2E profile that owns the selected scenario.
        required: true
        type: string
      scenario_file:
        description: Test file selected from the profile's allowlist.
        required: true
        type: string
      scenario_name:
        description: Exact Jest test title or unique literal fragment.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: focused-detox-${{ inputs.pr_number }}-scenario
  cancel-in-progress: true

env:
  CI: 'true'
  TZ: UTC

jobs:
  validate_focused_selection:
    name: Validate focused PR and scenario
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      fingerprints: ${{ toJSON(steps.fingerprints.outputs) }}
      scenario_file: ${{ steps.validate_scenario.outputs.scenario_file }}
    steps:
      # Bind dispatch inputs to the live PR head before checking out or running its workflow code.
      - name: Verify open same-repository PR head
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUSED_PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          [[ "$FOCUSED_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid pull request number."; exit 1; }
          pr="$(gh api "repos/$EXPECTED_REPOSITORY/pulls/$FOCUSED_PR_NUMBER")"
          [[ "$(jq -r '.state' <<<"$pr")" == open ]] || { echo "::error::Pull request is not open."; exit 1; }
          [[ "$(jq -r '.base.ref' <<<"$pr")" == main ]] || { echo "::error::Pull request must target main."; exit 1; }
          [[ "$(jq -r '.head.repo.full_name // empty' <<<"$pr")" == "$EXPECTED_REPOSITORY" ]] || { echo "::error::Fork pull requests are not accepted for focused validation."; exit 1; }
          [[ "$(jq -r '.head.ref' <<<"$pr")" == "$EXPECTED_REF" ]] || { echo "::error::Dispatch ref does not match the pull request branch."; exit 1; }
          [[ "$(jq -r '.head.sha' <<<"$pr")" == "$EXPECTED_SHA" ]] || { echo "::error::Dispatch SHA is stale or unrelated to the pull request head."; exit 1; }
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Validate profile and literal scenario selector
        id: validate_scenario
        env:
          FOCUSED_PROFILE: ${{ inputs.profile }}
          FOCUSED_SCENARIO_FILE: ${{ inputs.scenario_file }}
          FOCUSED_SCENARIO_NAME: ${{ inputs.scenario_name }}
        run: node scripts/ci/focused-detox-scenario.mjs validate "$FOCUSED_PROFILE" "$FOCUSED_SCENARIO_FILE" "$FOCUSED_SCENARIO_NAME"
      - name: Compute current-head build fingerprints
        id: fingerprints
        run: node scripts/ci/detox-cache-fingerprint-cli.mjs --derived-data-only

  produce_focused_profile_app:
    name: Produce focused profile app
    needs: [validate_focused_selection]
    if: ${{ inputs.profile == 'release' || inputs.profile == 'transcription' }}
    uses: ./.github/workflows/detox-e2e-profile-app-producer.yml
    with:
      profile: ${{ inputs.profile }}
      fingerprints: ${{ needs.validate_focused_selection.outputs.fingerprints }}

  run_focused_scenario:
    name: Focus ${{ inputs.profile }} scenario
    needs: [validate_focused_selection, produce_focused_profile_app]
    if: ${{ always() && needs.validate_focused_selection.result == 'success' && (needs.produce_focused_profile_app.result == 'success' || (inputs.profile != 'release' && inputs.profile != 'transcription')) }}
    uses: ./.github/workflows/detox-e2e-profile.yml
    with:
      profile: ${{ inputs.profile }}
      release_shard: ${{ inputs.profile == 'release' && needs.validate_focused_selection.outputs.scenario_file || '' }}
      app_artifact: ${{ toJSON(needs.produce_focused_profile_app.outputs) }}
      fingerprints: ${{ needs.validate_focused_selection.outputs.fingerprints }}
      resource_sampling: true
      scenario_name: ${{ inputs.scenario_name }}
      run_profile: true
      path_selection_failed: false
