name: Integration build

on:
  workflow_call:
    inputs:
      name: { required: true, type: string }
      profile: { required: true, type: string }
      artifact_name: { required: true, type: string }
      timeout_minutes: { required: true, type: number }
    outputs:
      archive_digest:
        value: ${{ jobs.validation.outputs.archive_digest }}
      manifest_digest:
        value: ${{ jobs.validation.outputs.manifest_digest }}

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  EXPECTED_NODE_VERSION: '22.23.2'

jobs:
  validation:
    name: ${{ inputs.name }}
    runs-on: xcode-27
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      archive_digest: ${{ steps.build.outputs.archive_digest }}
      manifest_digest: ${{ steps.build.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: ./.github/actions/ios-test-products-build
        id: build
        with:
          profile: ${{ inputs.profile }}
      - name: Publish verified products before allocating consumers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-focus/product-artifact
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build diagnostics on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_name }}-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ios-focus/*.log
            artifacts/ios-focus/*.jsonl
            artifacts/ios-focus/DerivedData/Build/Products/*.xctestrun
            artifacts/ios-focus/product-artifact/manifest.json
          if-no-files-found: warn
          retention-days: 7
