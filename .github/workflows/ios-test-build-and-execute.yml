name: Build and execute native tests on one host

on:
  workflow_call:
    inputs:
      cohort: { required: true, type: string }
      profile: { required: true, type: string }
      artifact_name: { required: true, type: string }
      timeout_minutes: { required: true, type: number }
      production_build: { required: false, type: boolean, default: false }
    outputs:
      archive_digest:
        value: ${{ jobs.validation.outputs.archive_digest }}
      manifest_digest:
        value: ${{ jobs.validation.outputs.manifest_digest }}

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  EXPECTED_NODE_VERSION: '22.23.2'

jobs:
  validation:
    name: Build and execute native ${{ inputs.cohort }}
    runs-on: xcode-27
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      archive_digest: ${{ steps.build.outputs.archive_digest }}
      manifest_digest: ${{ steps.build.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Diagnose this Debug host before dependencies, build or Simulator work
        if: inputs.cohort == 'debug'
        timeout-minutes: 2
        uses: ./.github/actions/ios-apple-model-host
        with: { evidence: artifacts/native-focus }
      - uses: ./.github/actions/ios-test-products-build
        id: build
        with:
          profile: ${{ inputs.profile }}
          production_build: ${{ inputs.production_build }}
      - name: Publish the Release products needed by fresh Speech runners
        if: inputs.cohort == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native-focus/product-artifact
          if-no-files-found: error
          retention-days: 7
      - name: Preserve the production receipt independently of native compilation
        if: ${{ always() && inputs.production_build }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-production-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native-focus/production-receipt.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify and execute on the same VM without dependency reinstallation or download
        uses: ./.github/actions/ios-test-cohort-run
        with:
          cohort: ${{ inputs.cohort }}
          profile: ${{ inputs.profile }}
          product_directory: artifacts/native-focus/product-artifact
          archive_digest: ${{ steps.build.outputs.archive_digest }}
          manifest_digest: ${{ steps.build.outputs.manifest_digest }}
      - name: Preserve build and host diagnostics even when eligibility failed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_name }}-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/native-focus/*.log
            artifacts/native-focus/*.jsonl
            artifacts/native-focus/DerivedData/Build/Products/*.xctestrun
            artifacts/native-focus/product-artifact/manifest.json
          if-no-files-found: warn
          retention-days: 7
