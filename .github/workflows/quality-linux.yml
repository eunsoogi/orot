name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep cancellation scoped to this workflow so parallel check sets do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  TZ: UTC
  EXPECTED_NODE_VERSION: '22.23.2'
  EXPECTED_PNPM_VERSION: '12.3.4'
  EXPECTED_RUBY_VERSION: '4.0.7'
  EXPECTED_LINUX_ARCH: x86_64

jobs:
  inventory:
    name: Maintained file inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Record maintained code inventory
        run: scripts/ci/run-command.sh quality-inventory artifacts/quality/quality-inventory.log -- pnpm quality:inventory

      - name: Upload inventory log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-quality-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality/
          if-no-files-found: error
          retention-days: 14

  source_loc:
    name: Source LOC policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Check canonical source line policy
        shell: bash
        # PR/push runs compare the merge base; manual runs audit the full tracked tree.
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            scripts/ci/run-command.sh source-loc artifacts/quality/source-loc.log -- node scripts/ci/check-loc.mjs --all
          else
            LOC_BASE_SHA="$(git merge-base origin/main HEAD)"
            scripts/ci/run-command.sh source-loc artifacts/quality/source-loc.log -- node scripts/ci/check-loc.mjs --base "$LOC_BASE_SHA"
          fi

      - name: Upload source LOC log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-source-loc-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality/
          if-no-files-found: error
          retention-days: 14

  surface_lint:
    name: Lint / ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: javascript
            label: JavaScript
          - surface: typescript
            label: TypeScript
          - surface: swift
            label: Swift
          - surface: objective-c
            label: Objective-C
          - surface: shell
            label: Shell
          - surface: ruby
            label: Ruby
          - surface: yaml
            label: YAML
          - surface: json
            label: JSON
          - surface: xml
            label: XML
          - surface: properties
            label: Properties
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache pnpm lockfile verification
        uses: ./.github/actions/pnpm-lockfile-verification
        with:
          pnpm-version: ${{ env.EXPECTED_PNPM_VERSION }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '4.0.7'
          bundler-cache: false

      - name: Verify Linux portable toolchain
        run: scripts/ci/verify-toolchain.sh --portable

      - name: Install frozen workspace dependencies
        run: scripts/ci/run-command.sh install artifacts/quality/install.log -- pnpm install --frozen-lockfile

      - name: Cache pinned quality tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/orot-quality
          key: orot-quality-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/quality/tool-versions.json') }}

      - name: Install pinned quality tools
        run: scripts/ci/run-command.sh quality-tools-install artifacts/quality/quality-tools-install.log -- pnpm quality:setup -- --platform linux

      # Every leaf validates the full maintained inventory before selecting one lint surface.
      - name: Record maintained code inventory
        run: scripts/ci/run-command.sh quality-inventory artifacts/quality/quality-inventory.log -- pnpm quality:inventory

      - name: Lint complete configured surface
        run: scripts/ci/run-command.sh lint-${{ matrix.surface }} artifacts/quality/lint-${{ matrix.surface }}.log -- pnpm lint -- --platform linux --surface "${{ matrix.surface }}"

      - name: Upload lint and inventory logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-quality-lint-${{ matrix.surface }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality/
          if-no-files-found: error
          retention-days: 14

  format_check:
    name: Format check
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache pnpm lockfile verification
        uses: ./.github/actions/pnpm-lockfile-verification
        with:
          pnpm-version: ${{ env.EXPECTED_PNPM_VERSION }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '4.0.7'
          bundler-cache: false

      - name: Verify Linux portable toolchain
        run: scripts/ci/verify-toolchain.sh --portable

      - name: Install frozen workspace dependencies
        run: scripts/ci/run-command.sh install artifacts/quality/install.log -- pnpm install --frozen-lockfile

      - name: Cache pinned quality tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/orot-quality
          key: orot-quality-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/quality/tool-versions.json') }}

      - name: Install pinned quality tools
        run: scripts/ci/run-command.sh quality-tools-install artifacts/quality/quality-tools-install.log -- pnpm quality:setup -- --platform linux

      - name: Check complete maintained-file formatting
        run: scripts/ci/run-command.sh format artifacts/quality/format.log -- pnpm format:check -- --platform linux

      - name: Upload format and setup logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-quality-format-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality/
          if-no-files-found: error
          retention-days: 14
