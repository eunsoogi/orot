name: Quality Linux

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  EXPECTED_NODE_VERSION: '22.23.2'
  EXPECTED_PNPM_VERSION: '12.3.4'
  EXPECTED_RUBY_VERSION: '4.0.7'
  EXPECTED_LINUX_ARCH: x86_64

jobs:
  quality:
    name: Quality Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '4.0.7'
          bundler-cache: false

      - name: Cache pnpm lockfile verification
        uses: ./.github/actions/pnpm-lockfile-verification
        with:
          pnpm-version: ${{ env.EXPECTED_PNPM_VERSION }}

      - name: Verify Linux portable toolchain
        run: scripts/ci/verify-toolchain.sh --portable

      - name: Install frozen workspace dependencies
        run: scripts/ci/run-command.sh install artifacts/quality/install.log -- pnpm install --frozen-lockfile

      - name: Cache pinned quality tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/orot-quality
          key: orot-quality-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/quality/tool-versions.json') }}

      - name: Install pinned quality tools
        run: scripts/ci/run-command.sh quality-tools-install artifacts/quality/quality-tools-install.log -- pnpm quality:setup -- --platform linux

      - name: Record maintained code inventory
        run: scripts/ci/run-command.sh quality-inventory artifacts/quality/quality-inventory.log -- pnpm quality:inventory

      - name: Test CI and release gate rules
        run: scripts/ci/run-command.sh gate-tests artifacts/quality/gate-tests.log -- node --test scripts/ci/tests/*.test.mjs scripts/release/tests/*.test.mjs scripts/quality/tests/*.test.mjs

      - name: Lint
        run: scripts/ci/run-command.sh lint artifacts/quality/lint.log -- pnpm lint -- --platform linux

      - name: Check formatting
        run: scripts/ci/run-command.sh format artifacts/quality/format.log -- pnpm format:check -- --platform linux

      - name: Type check
        run: scripts/ci/run-command.sh typecheck artifacts/quality/typecheck.log -- pnpm typecheck

      - name: Run unit and component tests
        run: scripts/ci/run-test-suite.sh unit artifacts/quality

      - name: Upload quality logs and test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-quality-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality/
          if-no-files-found: error
          retention-days: 14
