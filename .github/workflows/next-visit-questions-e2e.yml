name: Next Visit Questions iOS E2E

on:
  pull_request:
    paths:
      - '.github/workflows/detox-e2e-profile.yml'
      - '.github/workflows/next-visit-questions-e2e.yml'
      - 'apps/mobile/src/nextVisitQuestions/**'
      - 'apps/mobile/e2e/next-visit-questions*'
      - 'apps/mobile/e2e/nextVisitQuestionsProbe.tsx'
      - 'apps/mobile/e2e/nextVisitQuestionsProbeEntry.tsx'
      - 'apps/mobile/.detoxrc.js'
      - 'apps/mobile/babel.config.js'
      - 'apps/mobile/package.json'
      - 'apps/mobile/metro.config.js'
      - 'apps/mobile/ios/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'scripts/ci/**'
      - '.github/actions/detox-cocoapods-cache/**'

permissions:
  contents: read

concurrency:
  group: next-visit-questions-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # This focused workflow computes one shared cache input for its reusable profile call.
  detox_cache_fingerprint:
    name: Compute shared Detox cache fingerprints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_inputs: ${{ steps.detox_cache_fingerprint.outputs.build_inputs }}
      build_input_count: ${{ steps.detox_cache_fingerprint.outputs.build_input_count }}
      native_dependencies: ${{ steps.detox_cache_fingerprint.outputs.native_dependencies }}
      native_dependency_input_count: ${{ steps.detox_cache_fingerprint.outputs.native_dependency_input_count }}
      privacy_manifest_input_sha256: ${{ steps.detox_cache_fingerprint.outputs.privacy_manifest_input_sha256 }}
      cocoapods_project_input_sha256: ${{ steps.detox_cache_fingerprint.outputs.cocoapods_project_input_sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Compute shared Detox cache fingerprints
        id: detox_cache_fingerprint
        run: node scripts/ci/detox-cache-fingerprint-cli.mjs --derived-data-only

  next_visit_questions:
    name: Next Visit Questions E2E
    needs: [detox_cache_fingerprint]
    uses: ./.github/workflows/detox-e2e-profile.yml
    with:
      profile: next-visit-questions
      fingerprints: ${{ toJSON(needs.detox_cache_fingerprint.outputs) }}
