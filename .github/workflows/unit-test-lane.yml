name: Unit Test lane

on:
  workflow_call:
    inputs:
      lane:
        required: true
        type: string

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  EXPECTED_NODE_VERSION: '22.23.2'
  EXPECTED_PNPM_VERSION: '12.3.4'

jobs:
  test:
    name: ${{ inputs.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache pnpm lockfile verification
        uses: ./.github/actions/pnpm-lockfile-verification
        with:
          pnpm-version: ${{ env.EXPECTED_PNPM_VERSION }}

      - name: Install frozen workspace dependencies
        run: scripts/ci/run-command.sh install artifacts/unit/install.log -- pnpm install --frozen-lockfile

      - name: Run installed native cache host regressions
        if: ${{ inputs.lane == 'packages' }}
        run: scripts/ci/run-command.sh native-cache artifacts/unit/native-cache.log -- bash scripts/native-cache/run-tests.sh

      - name: Run unit and component tests
        env:
          UNIT_LANE: ${{ inputs.lane }}
        run: scripts/ci/run-test-suite.sh "$UNIT_LANE" artifacts/unit

      - name: Upload unit test logs and results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-unit-component-${{ inputs.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/unit/
          if-no-files-found: error
          retention-days: 14
