name: Execute one compatible integration cohort

on:
  workflow_call:
    inputs:
      cohort: { required: true, type: string }
      profile: { required: true, type: string }
      artifact_name: { required: true, type: string }
      archive_digest: { required: true, type: string }
      manifest_digest: { required: true, type: string }
      timeout_minutes: { required: true, type: number }

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  EXPECTED_NODE_VERSION: '22.23.2'

jobs:
  execution:
    name: Execute integration ${{ inputs.cohort }} cohort
    runs-on: xcode-27
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen dependencies before test boot
        run: scripts/ci/run-command.sh ios-cohort-dependencies artifacts/ios-cohort/install.log -- pnpm install --frozen-lockfile
      - name: Download the exact compatible products
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-cohort/product-artifact
      - name: Verify and execute the exact downloaded cohort
        uses: ./.github/actions/ios-test-cohort-run
        with:
          cohort: ${{ inputs.cohort }}
          profile: ${{ inputs.profile }}
          product_directory: artifacts/ios-cohort/product-artifact
          archive_digest: ${{ inputs.archive_digest }}
          manifest_digest: ${{ inputs.manifest_digest }}
      - name: Preserve setup failures before cohort execution
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-cohort-setup-${{ inputs.cohort }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ios-cohort/*.log
            artifacts/ios-cohort/*.jsonl
          if-no-files-found: warn
          retention-days: 7
