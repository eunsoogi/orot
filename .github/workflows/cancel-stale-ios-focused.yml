name: Cancel superseded CI

on:
  pull_request:
    # A stacked PR's new head also supersedes its previous focused selection.
    # Draft/ready metadata supplies no replacement run and must preserve active validation.
    types: [synchronize, reopened]

permissions: {}

jobs:
  cancel_superseded_full:
    name: Cancel stale full run for updated PR
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
      pull-requests: read
    steps:
      # No checkout or PR-supplied code is executed with this token. Event values are compared as data only.
      - name: Cancel only verified superseded runs for this PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 0
          script: |
            const repository = context.payload.repository;
            const eventPr = context.payload.pull_request;
            const action = context.payload.action;
            const repo = context.repo;
            const workflowPath = '.github/workflows/e2e-test.yml';
            const validSha = (value) => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value);
            const validId = (value) => Number.isSafeInteger(value) && value > 0;
            const allowedActions = ['synchronize', 'reopened'];
            if (context.eventName !== 'pull_request' || !allowedActions.includes(action) ||
                repo.owner !== 'eunsoogi' || repo.repo !== 'orot' ||
                repository?.id !== 1400991370 || repository.full_name !== 'eunsoogi/orot' ||
                !validId(eventPr?.number) || context.payload.number !== eventPr.number ||
                !validId(eventPr?.id) || !validSha(eventPr.head?.sha) || typeof eventPr.draft !== 'boolean' ||
                typeof eventPr.updated_at !== 'string' || !Number.isFinite(Date.parse(eventPr.updated_at)) ||
                eventPr.head?.repo?.id !== repository.id || eventPr.base?.repo?.id !== repository.id ||
                typeof eventPr.head.ref !== 'string' || !eventPr.head.ref) {
              core.info('No cancellation: event identity is outside the supported boundary.');
              return;
            }
            const readCurrent = async () => (await github.rest.pulls.get({...repo, pull_number: eventPr.number})).data;
            // A delayed manager cannot act after the event's head or PR state has changed.
            const currentEvent = (pr) => pr.id === eventPr.id && pr.number === eventPr.number &&
              pr.state === 'open' && pr.head?.sha === eventPr.head.sha &&
              pr.head?.repo?.id === repository.id && pr.base?.repo?.id === repository.id &&
              pr.head?.ref === eventPr.head.ref && pr.updated_at === eventPr.updated_at && pr.draft === eventPr.draft;
            if (!currentEvent(await readCurrent())) {
              core.info('No cancellation: the PR has changed since this event.');
              return;
            }
            const workflow = (await github.rest.actions.getWorkflow({...repo, workflow_id: 'e2e-test.yml'})).data;
            if (!validId(workflow.id) || workflow.path !== workflowPath) throw new Error('Unexpected workflow identity');
            const active = new Set(['queued', 'in_progress', 'waiting', 'requested', 'pending']);
            const superseded = (run) => {
              if (!validId(run.id) || run.id === context.runId || run.workflow_id !== workflow.id ||
                  run.path !== workflowPath || run.repository?.id !== repository.id ||
                  run.head_repository?.id !== repository.id || run.event !== 'pull_request' ||
                  run.head_branch !== eventPr.head.ref || !validSha(run.head_sha) ||
                  !active.has(run.status) || run.conclusion !== null || run.run_attempt !== 1 ||
                  run.pull_requests?.length !== 1 || run.pull_requests[0].id !== eventPr.id ||
                  run.pull_requests[0].number !== eventPr.number) return false;
              if (run.head_sha !== eventPr.head.sha) return true;
              // Reopening starts a replacement run; metadata-only draft/ready changes do not.
              if (action !== 'reopened') return false;
              const created = Date.parse(run.created_at);
              const changed = Date.parse(eventPr.updated_at);
              return Number.isFinite(created) && Number.isFinite(changed) && created + 1000 <= changed;
            };
            const runs = [];
            for (let page = 1; page <= 10; page++) {
              const response = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: workflow.id, event: 'pull_request', branch: eventPr.head.ref, per_page: 100, page,
              });
              if (response.data.total_count > 1000) throw new Error('Run inventory exceeds the bounded cancellation window');
              runs.push(...response.data.workflow_runs);
              if (response.data.workflow_runs.length < 100) break;
              if (page === 10) throw new Error('Run inventory cannot be confirmed complete');
            }
            for (const candidate of runs.filter(superseded)) {
              if (!currentEvent(await readCurrent())) {
                core.info('Stopped cancellation: the PR changed during inspection.');
                return;
              }
              const run = (await github.rest.actions.getWorkflowRun({...repo, run_id: candidate.id})).data;
              if (!superseded(run) || run.id !== candidate.id || run.head_sha !== candidate.head_sha) continue;
              await github.rest.actions.cancelWorkflowRun({...repo, run_id: run.id});
              core.info(`Cancellation requested for superseded run ${run.id}.`);
            }
  cancel_superseded_focus:
    name: Cancel stale focused run for updated PR
    if: ${{ github.event.action == 'synchronize' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    concurrency:
      # Match the reusable focus workflow's PR-scoped group to cancel only its stale run.
      group: focused-ios-${{ github.event.pull_request.number }}-scenario
      cancel-in-progress: true
    steps:
      - name: Record focused run supersession
        run: echo "A new pull request head supersedes any prior focused scenario for this PR."
