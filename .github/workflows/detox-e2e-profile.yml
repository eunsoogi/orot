name: Detox iOS E2E profile

on:
  workflow_call:
    inputs:
      profile:
        description: The isolated Detox app configuration to build and test.
        required: true
        type: string
      fingerprints:
        description: Shared source and build fingerprints from the profile workflow.
        required: true
        type: string
      resource_sampling:
        description: Collect bounded process and memory samples for diagnosis.
        required: false
        type: boolean
        default: false
      trace_logging: { type: boolean, default: false }
    outputs:
      profile:
        description: The profile whose complete Jest summary passed validation.
        value: ${{ jobs.detox_profile.outputs.profile }}
      test_cases:
        description: The validated number of passing E2E cases.
        value: ${{ jobs.detox_profile.outputs.test_cases }}
      test_suites:
        description: The validated number of passing Jest suites.
        value: ${{ jobs.detox_profile.outputs.test_suites }}

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  DEVELOPER_DIR: ${{ inputs.profile == 'transcription' && '/Applications/Xcode_26.2.app/Contents/Developer' || '/Applications/Xcode.app/Contents/Developer' }}
  EXPECTED_NODE_VERSION: '22.23.2'
  EXPECTED_PNPM_VERSION: '12.3.4'
  EXPECTED_RUBY_VERSION: '4.0.7'
  EXPECTED_COCOAPODS_VERSION: '1.17.0'
  EXPECTED_APPLESIMUTILS_VERSION: '0.9.12'
  EXPECTED_XCODE_VERSION: ${{ inputs.profile == 'transcription' && '26.2' || '27.0' }}
  EXPECTED_IOS_SIMULATOR_SDK: ${{ inputs.profile == 'transcription' && '26.2' || '27.0' }}
  EXPECTED_IOS_SIMULATOR_RUNTIME_NAME: ${{ inputs.profile == 'transcription' && 'iOS 26.2' || 'iOS 27.0' }}
  EXPECTED_IOS_SIMULATOR_RUNTIME_IDENTIFIER: ${{ inputs.profile == 'transcription' && 'com.apple.CoreSimulator.SimRuntime.iOS-26-2' || 'com.apple.CoreSimulator.SimRuntime.iOS-27-0' }}
  EXPECTED_DETOX_SIMULATOR_DEVICE_NAME: ${{ inputs.profile == 'transcription' && 'iPhone 17 Pro' || 'iPhone 18 Pro' }}
  EXPECTED_DETOX_SIMULATOR_DEVICE_TYPE_ID: ${{ inputs.profile == 'transcription' && 'com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro' || 'com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro' }}
  DETOX_CACHE_RUNTIME_SUFFIX: ${{ inputs.profile == 'transcription' && '-runtime-ios26.2-device-iphone17pro' || '' }}

jobs:
  detox_profile:
    name: Detox ${{ inputs.profile }} iOS E2E
    # Only the speech probe selects the installed image containing its measured model-compatible runtime.
    runs-on: ${{ inputs.profile == 'transcription' && 'macos-26' || 'xcode-27' }}
    timeout-minutes: 75
    outputs:
      profile: ${{ steps.run_detox_tests.outputs.e2e_profile }}
      test_cases: ${{ steps.run_detox_tests.outputs.e2e_test_cases }}
      test_suites: ${{ steps.run_detox_tests.outputs.e2e_test_suites }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache pnpm lockfile verification
        uses: ./.github/actions/pnpm-lockfile-verification
        with:
          pnpm-version: ${{ env.EXPECTED_PNPM_VERSION }}
      - name: Verify runner toolchain # Validate before Simulator boot.
        id: verify_toolchain
        run: scripts/ci/verify-toolchain.sh
      - name: Install dependencies and check Speech readiness
        timeout-minutes: 15
        run: scripts/ci/run-command.sh install artifacts/detox/install.log -- bash -euc 'pnpm install --frozen-lockfile; [[ "${{ inputs.profile }}" != transcription ]] || scripts/ci/run-command.sh speech-readiness-regression artifacts/detox/speech-readiness-regression.log -- apps/mobile/e2e/transcription/run-readiness-regression.sh'
      - name: Prepare dedicated Detox Simulator # Boot overlaps cache prep; probes and cleanup always run.
        id: prepare_detox_simulator
        timeout-minutes: 15
        run: scripts/ci/run-command.sh detox-simulator-prepare artifacts/detox/simulator-prepare.log -- bash scripts/ci/prepare-detox-simulator.sh artifacts/detox/simulator-setup.log artifacts/detox/simulator.udid "${{ inputs.profile }}"
      - name: Cache Detox profile app product # The key retains profile-local runner and Xcode identity.
        id: profile_derived_data_cache
        timeout-minutes: 10
        uses: ./.github/actions/detox-profile-app-cache/restore
        with:
          profile: ${{ inputs.profile }}
          fingerprints: ${{ inputs.fingerprints }}
          key: orot-detox-app-product-v10-${{ runner.os }}-${{ runner.arch }}-macos-${{ steps.verify_toolchain.outputs.macos_version }}-node-${{ env.EXPECTED_NODE_VERSION }}-pnpm-${{ env.EXPECTED_PNPM_VERSION }}-ruby-${{ env.EXPECTED_RUBY_VERSION }}-cocoapods-${{ env.EXPECTED_COCOAPODS_VERSION }}-xcode-${{ env.EXPECTED_XCODE_VERSION }}-build-${{ steps.verify_toolchain.outputs.xcodebuild_fingerprint }}-sdk-${{ env.EXPECTED_IOS_SIMULATOR_SDK }}-${{ inputs.profile }}${{ env.DETOX_CACHE_RUNTIME_SUFFIX }}-native-${{ fromJSON(inputs.fingerprints).native_dependencies }}-build-${{ fromJSON(inputs.fingerprints).build_inputs }}
          restore_keys: |
            orot-detox-app-product-v10-${{ runner.os }}-${{ runner.arch }}-macos-${{ steps.verify_toolchain.outputs.macos_version }}-node-${{ env.EXPECTED_NODE_VERSION }}-pnpm-${{ env.EXPECTED_PNPM_VERSION }}-ruby-${{ env.EXPECTED_RUBY_VERSION }}-cocoapods-${{ env.EXPECTED_COCOAPODS_VERSION }}-xcode-${{ env.EXPECTED_XCODE_VERSION }}-build-${{ steps.verify_toolchain.outputs.xcodebuild_fingerprint }}-sdk-${{ env.EXPECTED_IOS_SIMULATOR_SDK }}-${{ inputs.profile }}${{ env.DETOX_CACHE_RUNTIME_SUFFIX }}-native-${{ fromJSON(inputs.fingerprints).native_dependencies }}-
      - name: Prepare restored Detox DerivedData cache
        id: prepare_derived_data_cache
        timeout-minutes: 5
        env:
          DETOX_CACHE_RUNNER_OS: ${{ runner.os }}
          DETOX_CACHE_RUNNER_ARCH: ${{ runner.arch }}
          MACOS_VERSION: ${{ steps.verify_toolchain.outputs.macos_version }}
          EXPECTED_XCODE_VERSION: ${{ env.EXPECTED_XCODE_VERSION }}
          EXPECTED_IOS_SIMULATOR_SDK: ${{ env.EXPECTED_IOS_SIMULATOR_SDK }}
        run: node scripts/ci/detox-derived-data-cache.mjs prepare "${{ inputs.profile }}"
      - name: Cache Detox framework outputs # Only app-cache misses use the standalone fallback.
        id: detox_framework_cache
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        timeout-minutes: 10
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/Library/Detox/ios/framework
            ~/Library/Detox/ios/xcuitest-runner
          key: >-
            orot-detox-framework-v1-${{ runner.os }}-${{ runner.arch }}-macos-${{ steps.verify_toolchain.outputs.macos_version }}-xcode-${{ steps.verify_toolchain.outputs.xcodebuild_fingerprint }}-lock-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build Detox iOS framework cache
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' && steps.detox_framework_cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 20
        run: scripts/ci/run-command.sh detox-framework-cache artifacts/detox/framework-cache.log -- pnpm --filter @orot/mobile exec -- detox build-framework-cache
      - name: Prepare React Native artifact cache fingerprint
        id: rn_artifact_fingerprint
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        env:
          PNPM_LOCKFILE_HASH: ${{ hashFiles('pnpm-lock.yaml') }}
          PODFILE_LOCK_HASH: ${{ hashFiles('apps/mobile/ios/Podfile.lock') }}
        run: scripts/ci/prepare-rn-artifact-fingerprint.sh
      - name: Cache React Native artifact archives
        id: rn_artifact_cache
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        timeout-minutes: 10
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/ReactNative
          key: orot-rn-ios-artifacts-v3-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.EXPECTED_XCODE_VERSION }}-sdk-${{ env.EXPECTED_IOS_SIMULATOR_SDK }}-${{ inputs.profile }}-${{ steps.rn_artifact_fingerprint.outputs.fingerprint }}
      - name: Set up Ruby
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '4.0.7'
          bundler-cache: false
      - name: Cache Detox CocoaPods intermediates # Include the observed macOS patch version.
        id: cocoapods_cache
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        uses: ./.github/actions/detox-cocoapods-cache
        with:
          cache-context: >-
            ${{ runner.os }}-${{ runner.arch }}-macos-${{ steps.verify_toolchain.outputs.macos_version }}-node-${{ env.EXPECTED_NODE_VERSION }}-pnpm-${{ env.EXPECTED_PNPM_VERSION }}-ruby-${{ env.EXPECTED_RUBY_VERSION }}-cocoapods-${{ env.EXPECTED_COCOAPODS_VERSION }}-xcode-${{ env.EXPECTED_XCODE_VERSION }}-sdk-${{ env.EXPECTED_IOS_SIMULATOR_SDK }}${{ env.DETOX_CACHE_RUNTIME_SUFFIX }}
      - name: Install CocoaPods
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        run: scripts/ci/run-command.sh cocoapods-install artifacts/detox/cocoapods-install.log -- gem install cocoapods --version "${EXPECTED_COCOAPODS_VERSION}" --no-document
      - name: Install Detox CocoaPods dependencies # The path hook is limited to this install after toolchain validation.
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        timeout-minutes: 20
        run: bash scripts/ci/install-detox-cocoapods.sh
      - name: Record Detox cache state
        timeout-minutes: 1
        env:
          DETOX_PROFILE: ${{ inputs.profile }}
          DETOX_FRAMEWORK_CACHE_HIT: ${{ steps.prepare_derived_data_cache.outputs.detox_artifacts_reusable == 'true' || steps.detox_framework_cache.outputs.cache-hit == 'true' }}
          RN_ARTIFACT_CACHE_HIT: ${{ steps.rn_artifact_cache.outputs.cache-hit }}
          COCOAPODS_CACHE_HIT: ${{ steps.cocoapods_cache.outputs.cache-hit }}
          PROFILE_DERIVED_DATA_CACHE_HIT: ${{ steps.profile_derived_data_cache.outputs.cache-hit }}
          BUILD_INPUT_FINGERPRINT: ${{ steps.profile_derived_data_cache.outputs.build_inputs }}
          RN_ARTIFACT_FINGERPRINT: ${{ steps.rn_artifact_fingerprint.outputs.fingerprint }}
          NATIVE_DEPENDENCY_FINGERPRINT: ${{ steps.profile_derived_data_cache.outputs.native_dependencies }}
          DERIVED_DATA_CACHE_CLASSIFICATION: ${{ steps.prepare_derived_data_cache.outputs.derived_data_cache_classification }}
          DERIVED_DATA_CACHE_DIAGNOSTIC: ${{ steps.prepare_derived_data_cache.outputs.derived_data_cache_diagnostic }}
          APP_REUSABLE: ${{ steps.prepare_derived_data_cache.outputs.app_reusable }}
          APP_REUSE_REASON: ${{ steps.prepare_derived_data_cache.outputs.app_reuse_reason }}
          PRIVACY_MANIFEST_INPUT_SHA256: ${{ steps.profile_derived_data_cache.outputs.privacy_manifest_input_sha256 }}
          MACOS_VERSION: ${{ steps.verify_toolchain.outputs.macos_version }}
          NODE_VERSION: ${{ env.EXPECTED_NODE_VERSION }}
          PNPM_VERSION: ${{ env.EXPECTED_PNPM_VERSION }}
          RUBY_VERSION: ${{ env.EXPECTED_RUBY_VERSION }}
          COCOAPODS_VERSION: ${{ env.EXPECTED_COCOAPODS_VERSION }}
        run: scripts/ci/record-detox-cache-state.sh artifacts/detox/native-cache.log

      - name: Install Detox Simulator utilities
        timeout-minutes: 10
        run: scripts/ci/run-command.sh applesimutils-install artifacts/detox/applesimutils-install.log -- bash scripts/ci/install-applesimutils.sh

      - name: Build Detox iOS Simulator app
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        timeout-minutes: 45
        run: scripts/ci/run-command.sh detox-build artifacts/detox/build.log -- bash scripts/ci/build-detox-apps.sh "${{ inputs.profile }}" --skip-pods

      - name: Write Detox DerivedData cache manifest
        id: write_derived_data_cache
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        timeout-minutes: 5
        env:
          DETOX_CACHE_RUNNER_OS: ${{ runner.os }}
          DETOX_CACHE_RUNNER_ARCH: ${{ runner.arch }}
          EXPECTED_DETOX_BUILD_INPUT_FINGERPRINT: ${{ steps.profile_derived_data_cache.outputs.build_inputs }}
          EXPECTED_DETOX_NATIVE_DEPENDENCY_FINGERPRINT: ${{ steps.profile_derived_data_cache.outputs.native_dependencies }}
          EXPECTED_PRIVACY_MANIFEST_INPUT_SHA256: ${{ steps.profile_derived_data_cache.outputs.privacy_manifest_input_sha256 }}
          MACOS_VERSION: ${{ steps.verify_toolchain.outputs.macos_version }}
          EXPECTED_XCODE_VERSION: ${{ env.EXPECTED_XCODE_VERSION }}
          EXPECTED_IOS_SIMULATOR_SDK: ${{ env.EXPECTED_IOS_SIMULATOR_SDK }}
        shell: bash
        run: |
          node scripts/ci/detox-derived-data-cache.mjs write "${{ inputs.profile }}" 2>&1 | tee -a artifacts/detox/native-cache.log

      - name: Save validated Detox profile app product
        timeout-minutes: 10
        uses: ./.github/actions/detox-profile-app-cache/save
        with:
          profile: ${{ inputs.profile }}
          key: ${{ steps.profile_derived_data_cache.outputs.cache-hit != 'true' && steps.write_derived_data_cache.outcome == 'success' && steps.profile_derived_data_cache.outputs.cache-primary-key || '' }}
      - name: Wait for dedicated Detox Simulator
        timeout-minutes: 20
        run: scripts/ci/run-command.sh detox-simulator-boot artifacts/detox/simulator-boot.log -- bash scripts/ci/wait-detox-simulator.sh "${{ steps.prepare_detox_simulator.outputs.udid }}"

      - name: Run Detox iOS Simulator tests
        id: run_detox_tests
        timeout-minutes: 45
        env:
          OROT_DETOX_RESOURCE_SAMPLING: ${{ inputs.resource_sampling }}
        run: OROT_DETOX_TEST_LOG_LEVEL="${{ inputs.trace_logging && 'trace' || 'info' }}" scripts/ci/run-test-suite.sh "e2e-${{ inputs.profile }}" artifacts/detox

      - name: Collect simulator logs
        if: ${{ always() }}
        timeout-minutes: 5
        run: scripts/ci/collect-simulator-diagnostics.sh artifacts/detox/e2e-test.log artifacts/detox/simulator.log artifacts/detox/simulator.udid

      - name: Delete dedicated Detox Simulator
        if: ${{ always() }}
        timeout-minutes: 15
        run: |
          if [[ ! -s artifacts/detox/simulator.udid ]]; then
            printf 'No dedicated Simulator ID was recorded; no device will be targeted.\n' > artifacts/detox/simulator-teardown.log
            exit 0
          fi
          simulator_udid="$(cat artifacts/detox/simulator.udid)"
          scripts/ci/run-command.sh detox-simulator-teardown artifacts/detox/simulator-teardown.log -- bash scripts/ci/teardown-detox-simulator.sh "$simulator_udid" artifacts/detox/simulator-teardown-details.log

      - name: Upload Detox reports, logs, screenshots, and videos
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-detox-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/detox/
          if-no-files-found: error
          retention-days: 14
