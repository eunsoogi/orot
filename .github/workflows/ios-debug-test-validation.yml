name: iOS Debug test validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  approval:
    name: Approve native Debug execution
    runs-on: ubuntu-24.04
    environment: { name: native-ci-admin-approval }
    timeout-minutes: 5
    steps:
      - run: echo 'Administrator approved this native Debug run.'
  products:
    needs: approval
    uses: ./.github/workflows/ios-test-product-build.yml
    with:
      profile: provider-data
      artifact_name: ios-test-debug-products
  execution:
    needs: products
    uses: ./.github/workflows/ios-test-cohort-execution.yml
    with:
      cohort: debug
      profile: provider-data
      artifact_name: ios-test-debug-products
      archive_digest: ${{ needs.products.outputs.archive_digest }}
      manifest_digest: ${{ needs.products.outputs.manifest_digest }}
      timeout_minutes: 180
  completeness:
    name: Debug native completeness
    needs: [products, execution]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Require the Debug boundaries
        env:
          PRODUCTS: ${{ needs.products.result }}
          EXECUTION: ${{ needs.execution.result }}
        run: test "$PRODUCTS" = success && test "$EXECUTION" = success
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-cohort-report-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native-reports/debug
      - name: Verify every Debug observation at this head
        run: node scripts/ci/ios-test-cohort-results.mjs debug artifacts/native-reports/debug/results.json artifacts/native-reports/debug-verified.json
