name: Detox E2E profiles

on:
  workflow_call:
    inputs:
      trace_logging:
        description: Enable Detox trace logging for manual diagnostics.
        required: false
        type: boolean
        default: false
      resource_sampling:
        description: Collect bounded process and memory samples for manual diagnostics.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Fingerprinting improves cache reuse; each profile has a synchronous fallback when it fails.
  detox_cache_fingerprint:
    name: Compute shared Detox cache fingerprints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_inputs: ${{ steps.detox_cache_fingerprint.outputs.build_inputs }}
      build_input_count: ${{ steps.detox_cache_fingerprint.outputs.build_input_count }}
      native_dependencies: ${{ steps.detox_cache_fingerprint.outputs.native_dependencies }}
      native_dependency_input_count: ${{ steps.detox_cache_fingerprint.outputs.native_dependency_input_count }}
      privacy_manifest_input_sha256: ${{ steps.detox_cache_fingerprint.outputs.privacy_manifest_input_sha256 }}
      cocoapods_project_input_sha256: ${{ steps.detox_cache_fingerprint.outputs.cocoapods_project_input_sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Compute shared Detox cache fingerprints
        id: detox_cache_fingerprint
        run: node scripts/ci/detox-cache-fingerprint-cli.mjs --derived-data-only

  detox_release_e2e:
    name: Release shards
    needs: [detox_cache_fingerprint]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/detox-e2e-release.yml
    with:
      fingerprints: ${{ toJSON(needs.detox_cache_fingerprint.outputs) }}
      trace_logging: ${{ inputs.trace_logging }}
      resource_sampling: ${{ inputs.resource_sampling }}

  detox_openai_provider_e2e:
    name: OpenAI Debug E2E
    needs: [detox_cache_fingerprint]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/detox-e2e-profile.yml
    with:
      profile: openai-provider
      fingerprints: ${{ toJSON(needs.detox_cache_fingerprint.outputs) }}
      trace_logging: ${{ inputs.trace_logging }}
      resource_sampling: ${{ inputs.resource_sampling }}

  detox_transcription_e2e:
    name: Speech Transcription E2E
    needs: [detox_cache_fingerprint]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/detox-e2e-profile.yml
    with:
      profile: transcription
      fingerprints: ${{ toJSON(needs.detox_cache_fingerprint.outputs) }}
      trace_logging: ${{ inputs.trace_logging }}
      resource_sampling: ${{ inputs.resource_sampling }}

  detox_next_visit_e2e:
    name: Next Visit Questions E2E
    needs: [detox_cache_fingerprint]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/detox-e2e-profile.yml
    with:
      profile: next-visit-questions
      fingerprints: ${{ toJSON(needs.detox_cache_fingerprint.outputs) }}
      trace_logging: ${{ inputs.trace_logging }}
      resource_sampling: ${{ inputs.resource_sampling }}
