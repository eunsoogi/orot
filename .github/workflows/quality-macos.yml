name: Quality macOS

# Keep the Xcode-only C-family formatter on Apple runners; simulator builds stay in the caller workflow.
on:
  workflow_call:

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  EXPECTED_NODE_VERSION: '22.23.2'
  EXPECTED_PNPM_VERSION: '12.3.4'
  EXPECTED_RUBY_VERSION: '4.0.7'
  EXPECTED_COCOAPODS_VERSION: '1.17.0'
  EXPECTED_MACOS_VERSION: '27.0'
  EXPECTED_XCODE_VERSION: '27.0'
  EXPECTED_IOS_SIMULATOR_SDK: '27.0'

jobs:
  quality:
    name: Quality macOS
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Verify runner toolchain
        run: scripts/ci/verify-toolchain.sh

      - name: Install pinned Apple quality tools
        run: scripts/ci/run-command.sh quality-tools-install artifacts/quality/quality-tools-install.log -- pnpm quality:setup -- --platform macos

      - name: Lint Apple quality surfaces
        run: scripts/ci/run-command.sh lint artifacts/quality/lint.log -- pnpm lint -- --platform macos

      - name: Check Apple surface formatting
        run: scripts/ci/run-command.sh format artifacts/quality/format.log -- pnpm format:check -- --platform macos

      - name: Upload quality logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-quality-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality/
          if-no-files-found: error
          retention-days: 14
