name: iOS test validation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  EXPECTED_NODE_VERSION: '22.23.2'

jobs:
  native_products:
    name: Build iOS Release test products
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      archive_digest: ${{ steps.products.outputs.archive_digest }}
      manifest_digest: ${{ steps.products.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install workspace dependencies
        run: scripts/ci/run-command.sh ios-test-dependencies artifacts/ios-tests/install.log -- pnpm install --frozen-lockfile
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '4.0.7'
          bundler-cache: false
      - name: Install pinned CocoaPods
        run: gem install cocoapods --version 1.17.0 --no-document
      - name: Prepare native dependencies
        run: scripts/ci/run-command.sh ios-test-pods artifacts/ios-tests/pods.log -- pnpm --filter @orot/mobile ios:pods --deployment
      - name: Verify generated privacy metadata
        run: node scripts/ci/ios-test-source-inputs.mjs
      - name: Build without booting a test simulator
        run: scripts/ci/run-command.sh ios-test-build artifacts/ios-tests/build.log -- node scripts/ci/build-ios-tests.mjs core artifacts/ios-tests/DerivedData
      - name: Package portable native test products
        id: products
        run: scripts/ci/run-command.sh test-products artifacts/ios-tests/products.log -- node scripts/ci/ios-test-products.mjs create core artifacts/ios-tests/DerivedData/Build/Products artifacts/ios-tests/product-artifact
      - name: Upload native test products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-test-release-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-tests/product-artifact
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-test-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ios-tests/*.log
            artifacts/ios-tests/*.jsonl
            artifacts/ios-tests/DerivedData/Build/Products/*.xctestrun
          if-no-files-found: warn
          retention-days: 7

  native_execution:
    name: Execute iOS ${{ matrix.profile }} ${{ matrix.suite }} tests
    needs: native_products
    runs-on: xcode-27
    # Original per-operation model budgets total 50 minutes; keep a separate setup allowance without increasing them.
    timeout-minutes: ${{ matrix.profile == 'local-model' && 65 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core
            suite: all
          - profile: speech
            suite: native
          - profile: speech
            suite: ui
          - profile: backup
            suite: all
          - profile: fixtures
            suite: navigation
          - profile: fixtures
            suite: recordings
          - profile: fixtures
            suite: questions
          - profile: fixtures
            suite: calendar
          - profile: local-model
            suite: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install JS dependencies before test boot
        run: scripts/ci/run-command.sh ios-test-dependencies artifacts/ios-tests/install.log -- pnpm install --frozen-lockfile
      - name: Download the producer's exact products
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-test-release-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-tests/product-artifact
      - name: Verify product provenance and integrity
        id: verify
        env:
          PROFILE: ${{ matrix.profile }}
          ARCHIVE_DIGEST: ${{ needs.native_products.outputs.archive_digest }}
          MANIFEST_DIGEST: ${{ needs.native_products.outputs.manifest_digest }}
        run: node scripts/ci/ios-test-products.mjs verify "$PROFILE" artifacts/ios-tests/product-artifact "$ARCHIVE_DIGEST" "$MANIFEST_DIGEST"
      - name: Provision the pinned Speech runtime
        if: matrix.profile == 'speech'
        run: bash scripts/ci/prepare-ios-test-runtime.sh speech
      - name: Boot the dedicated execution destination
        env:
          PROFILE: ${{ matrix.profile }}
        run: scripts/ci/run-command.sh ios-test-simulator artifacts/ios-tests/simulator.log -- node scripts/ci/ios-test-simulator.mjs prepare "$PROFILE" artifacts/ios-tests/simulator-owner.json
      - name: Verify app-host preparation before cold UI execution
        if: matrix.suite == 'ui' || matrix.profile == 'backup' || matrix.profile == 'fixtures'
        env:
          PROFILE: ${{ matrix.profile }}
          TEST_RUN: ${{ steps.verify.outputs.test_run }}
        run: scripts/ci/run-command.sh ios-ui-preparation artifacts/ios-tests/ui-preparation.log -- node scripts/ci/prepare-ios-test-ui.mjs "$PROFILE" "$TEST_RUN" artifacts/ios-tests/simulator-owner.json artifacts/ios-tests
      - name: Install Korean Speech assets without recognizing a fixture
        if: matrix.profile == 'speech'
        env:
          TEST_RUN: ${{ steps.verify.outputs.test_run }}
        run: |
          scripts/ci/run-command.sh ios-speech-assets artifacts/ios-tests/speech-assets.log -- node scripts/ci/run-ios-tests.mjs speech "$TEST_RUN" artifacts/ios-tests/simulator-owner.json artifacts/ios-tests/speech-assets.xcresult OrotIntegrationTests/SpeechAssetPreparationTests/testSelectedKoreanAssetsInstallWithoutRecognizingAnyFixture
          node scripts/ci/ios-test-results.mjs speech artifacts/ios-tests/speech-assets.xcresult artifacts/ios-tests/speech-assets.json OrotIntegrationTests/SpeechAssetPreparationTests/testSelectedKoreanAssetsInstallWithoutRecognizingAnyFixture
      - name: Execute without compilation or retry
        env:
          PROFILE: ${{ matrix.profile }}
          OROT_IOS_TEST_SUITE: ${{ matrix.suite }}
          TEST_RUN: ${{ steps.verify.outputs.test_run }}
        run: |
          if [[ "$PROFILE" == backup ]]; then
            scripts/ci/run-command.sh ios-backup-tests artifacts/ios-tests/tests.log -- node scripts/ci/run-ios-backup-tests.mjs "$TEST_RUN" artifacts/ios-tests/simulator-owner.json artifacts/ios-tests/backup
          elif [[ "$PROFILE" == local-model ]]; then
            scripts/ci/run-command.sh ios-local-model-tests artifacts/ios-tests/tests.log -- node scripts/ci/run-ios-local-model-tests.mjs "$TEST_RUN" artifacts/ios-tests/simulator-owner.json artifacts/ios-tests/local-model
          elif [[ "$PROFILE" == fixtures ]]; then
            scripts/ci/run-command.sh ios-fixture-tests artifacts/ios-tests/tests.log -- node scripts/ci/run-ios-fixture-tests.mjs "$PROFILE" "$TEST_RUN" artifacts/ios-tests/simulator-owner.json artifacts/ios-tests/fixtures
          else
            scripts/ci/run-command.sh ios-tests artifacts/ios-tests/tests.log -- node scripts/ci/run-ios-tests.mjs "$PROFILE" "$TEST_RUN" artifacts/ios-tests/simulator-owner.json artifacts/ios-tests/results.xcresult
            node scripts/ci/ios-test-results.mjs "$PROFILE" artifacts/ios-tests/results.xcresult artifacts/ios-tests/results.json
          fi
      - name: Export native evidence attachments
        if: always()
        run: |
          if [[ -d artifacts/ios-tests/results.xcresult ]]; then
            xcrun xcresulttool export attachments --path artifacts/ios-tests/results.xcresult --output-path artifacts/ios-tests/attachments
          fi
      - name: Verify actual Korean Speech observations
        if: ${{ success() && matrix.profile == 'speech' && matrix.suite == 'native' }}
        run: node scripts/ci/speech-test-evidence.mjs artifacts/ios-tests/attachments artifacts/ios-tests/speech-accuracy.json
      - name: Tear down the owned destination
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          if [[ -f artifacts/ios-tests/simulator-owner.json ]]; then
            node scripts/ci/ios-test-simulator.mjs cleanup "$PROFILE" artifacts/ios-tests/simulator-owner.json
          fi
      - name: Preserve native execution diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.profile }}-${{ matrix.suite }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ios-tests/*.log
            artifacts/ios-tests/*.json
            artifacts/ios-tests/*.jsonl
            artifacts/ios-tests/*.png
            artifacts/ios-tests/*.xcresult
            artifacts/ios-tests/attachments
            artifacts/ios-tests/backup
            artifacts/ios-tests/fixtures
            artifacts/ios-tests/local-model
            artifacts/ios-tests/product-artifact/manifest.json
          if-no-files-found: warn
          retention-days: 7

  debug_validation:
    name: Debug provider and isolated health import
    uses: ./.github/workflows/ios-debug-test-validation.yml
