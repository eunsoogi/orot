name: iOS test validation

on:
  workflow_call:
    inputs:
      production_build: { required: false, type: boolean, default: true }

permissions:
  contents: read

concurrency:
  # Full and diagnostic integration graphs share this repository budget; superseded PR runs are cancelled by their caller.
  group: ios-ci-macos-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan integration coverage and macOS budget
    runs-on: ubuntu-24.04
    # Required reviewer protection is configured in repository settings; approval precedes the first Debug VM and every successor.
    environment: { name: ios-ci-admin-approval }
    timeout-minutes: 5
    outputs:
      release_minutes: ${{ steps.plan.outputs.release_minutes }}
      speech_minutes: ${{ steps.plan.outputs.speech_minutes }}
      debug_minutes: ${{ steps.plan.outputs.debug_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Validate the complete logical plan before Mac allocation
        id: plan
        run: node scripts/ci/ios-test-cohort-plan-cli.mjs
  debug_execution:
    name: Debug provider and capability validation
    needs: plan
    uses: ./.github/workflows/ios-test-build-and-execute.yml
    with:
      cohort: debug
      profile: provider-data
      artifact_name: ios-test-debug-products
      timeout_minutes: ${{ fromJSON(needs.plan.outputs.debug_minutes) }}
  release_execution:
    name: Production and General Release validation
    needs: [plan, debug_execution]
    uses: ./.github/workflows/ios-test-build-and-execute.yml
    with:
      cohort: release
      profile: core
      artifact_name: ios-test-release-products
      production_build: ${{ inputs.production_build }}
      timeout_minutes: ${{ fromJSON(needs.plan.outputs.release_minutes) }}
  speech_execution:
    name: Authentic Korean Speech and UI validation
    needs: [plan, release_execution]
    uses: ./.github/workflows/ios-test-cohort-execution.yml
    with:
      cohort: speech
      sample: first
      profile: speech
      artifact_name: ios-test-release-products
      archive_digest: ${{ needs.release_execution.outputs.archive_digest }}
      manifest_digest: ${{ needs.release_execution.outputs.manifest_digest }}
      timeout_minutes: ${{ fromJSON(needs.plan.outputs.speech_minutes) }}
  speech_sample_2:
    name: Fresh Speech acceptance sample 2
    needs: [plan, release_execution, speech_execution]
    # A failed first attempt stays failed. The next fresh VM runs only after all original integration and UI assertions passed.
    if: ${{ needs.speech_execution.result == 'success' }}
    uses: ./.github/workflows/ios-test-cohort-execution.yml
    with:
      cohort: speech
      sample: second
      profile: speech
      artifact_name: ios-test-release-products
      archive_digest: ${{ needs.release_execution.outputs.archive_digest }}
      manifest_digest: ${{ needs.release_execution.outputs.manifest_digest }}
      timeout_minutes: ${{ fromJSON(needs.plan.outputs.speech_minutes) }}
  speech_sample_3:
    name: Fresh Speech acceptance sample 3
    needs: [plan, release_execution, speech_sample_2]
    if: ${{ needs.speech_sample_2.result == 'success' }}
    uses: ./.github/workflows/ios-test-cohort-execution.yml
    with:
      cohort: speech
      sample: third
      profile: speech
      artifact_name: ios-test-release-products
      archive_digest: ${{ needs.release_execution.outputs.archive_digest }}
      manifest_digest: ${{ needs.release_execution.outputs.manifest_digest }}
      timeout_minutes: ${{ fromJSON(needs.plan.outputs.speech_minutes) }}
  completeness:
    name: iOS test completeness
    needs: [release_execution, speech_execution, speech_sample_2, speech_sample_3, debug_execution]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Require every build and execution boundary to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs=JSON.parse(process.env.RESULTS); if(Object.values(jobs).some(job=>job.result!=="success")) throw new Error("Incomplete integration validation");'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-cohort-report-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-reports/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-cohort-report-speech-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-reports/speech
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-cohort-report-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-reports/debug
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-cohort-report-speech-second-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-reports/speech-second
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-cohort-report-speech-third-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-reports/speech-third
      - name: Verify complete current-head integration observations and authentic Speech
        run: |
          node scripts/ci/ios-test-cohort-results.mjs release artifacts/ios-reports/release/results.json artifacts/ios-reports/release-verified.json
          node scripts/ci/ios-test-cohort-results.mjs speech artifacts/ios-reports/speech/results.json artifacts/ios-reports/speech-verified.json
          node scripts/ci/ios-test-cohort-results.mjs debug artifacts/ios-reports/debug/results.json artifacts/ios-reports/debug-verified.json
          node scripts/ci/speech-test-evidence.mjs artifacts/ios-reports/speech/speech-integration/attachments artifacts/ios-reports/speech-accuracy.json
          node scripts/ci/ios-test-cohort-results.mjs speech artifacts/ios-reports/speech-second/results.json artifacts/ios-reports/speech-second-verified.json second
          node scripts/ci/speech-test-evidence.mjs artifacts/ios-reports/speech-second/speech-integration/attachments artifacts/ios-reports/speech-second-accuracy.json
          node scripts/ci/ios-test-cohort-results.mjs speech artifacts/ios-reports/speech-third/results.json artifacts/ios-reports/speech-third-verified.json third
          node scripts/ci/speech-test-evidence.mjs artifacts/ios-reports/speech-third/speech-integration/attachments artifacts/ios-reports/speech-third-accuracy.json
