name: Integration validation
on:
  workflow_call:
permissions: { contents: read }
concurrency:
  # Full and focused routes share one repository-wide native allocation window.
  group: ios-ci-macos-${{ github.repository }}
  cancel-in-progress: false
jobs:
  plan:
    name: Plan / Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      debug_matrix: ${{ steps.plan.outputs.debug_matrix }}
      release_matrix: ${{ steps.plan.outputs.release_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .nvmrc }
      - name: Validate all independent feature suites before Mac allocation
        id: plan
        run: node scripts/ci/ios-test-cohort-plan-cli.mjs
  production_validation:
    name: Build
    needs: plan
    uses: ./.github/workflows/ios-production-validation.yml
  oauth_products:
    name: Build
    needs: plan
    uses: ./.github/workflows/ios-oauth-build.yml
  oauth_execution:
    name: Test
    needs: oauth_products
    uses: ./.github/workflows/ios-oauth-execution.yml
    with:
      archive_digest: ${{ needs.oauth_products.outputs.archive_digest }}
      manifest_digest: ${{ needs.oauth_products.outputs.manifest_digest }}
  debug_products:
    name: Build
    needs: plan
    uses: ./.github/workflows/ios-test-products-build.yml
    with:
      name: Debug
      profile: provider-data
      artifact_name: ios-test-debug-products
      timeout_minutes: 60
  release_products:
    name: Build
    needs: plan
    uses: ./.github/workflows/ios-test-products-build.yml
    with:
      name: Release
      profile: core
      artifact_name: ios-test-release-products
      timeout_minutes: 60
  debug_execution:
    name: Test
    # The four independent Debug suites start as soon as their one shared build is available.
    needs: [plan, debug_products]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.debug_matrix) }}
    uses: ./.github/workflows/ios-test-cohort-execution.yml
    with:
      name: ${{ matrix.name }}
      cohort: ${{ matrix.cohort }}
      profile: ${{ matrix.profile }}
      artifact_name: ios-test-debug-products
      archive_digest: ${{ needs.debug_products.outputs.archive_digest }}
      manifest_digest: ${{ needs.debug_products.outputs.manifest_digest }}
      timeout_minutes: ${{ matrix.minutes }}
  release_execution:
    name: Test
    # No independent suite waits for another suite, Debug build, or production/OAuth work.
    needs: [plan, release_products]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.release_matrix) }}
    uses: ./.github/workflows/ios-test-cohort-execution.yml
    with:
      name: ${{ matrix.name }}
      cohort: ${{ matrix.cohort }}
      profile: ${{ matrix.profile }}
      artifact_name: ios-test-release-products
      archive_digest: ${{ needs.release_products.outputs.archive_digest }}
      manifest_digest: ${{ needs.release_products.outputs.manifest_digest }}
      timeout_minutes: ${{ matrix.minutes }}
  completeness:
    name: Validate / Complete
    needs:
      [
        plan,
        production_validation,
        oauth_products,
        oauth_execution,
        debug_products,
        release_products,
        debug_execution,
        release_execution,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .nvmrc }
      - name: Require every producer and executor to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs=JSON.parse(process.env.RESULTS); if(Object.values(jobs).some(job=>job.result!=="success")) throw new Error("Incomplete integration validation");'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ios-cohort-report-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-reports
      - name: Verify every planned first attempt and authentic Korean Speech evidence
        run: node scripts/ci/ios-test-plan-results.mjs artifacts/ios-reports
