name: iOS test validation

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      production_build: { required: false, type: boolean, default: true }

permissions:
  contents: read

jobs:
  plan:
    name: Plan native coverage and macOS budget
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_minutes: ${{ steps.plan.outputs.release_minutes }}
      speech_minutes: ${{ steps.plan.outputs.speech_minutes }}
      debug_minutes: ${{ steps.plan.outputs.debug_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Validate the complete logical plan before Mac allocation
        id: plan
        run: node scripts/ci/ios-test-cohort-plan-cli.mjs
  release_products:
    name: Production and Release native products
    needs: plan
    uses: ./.github/workflows/ios-test-product-build.yml
    with:
      profile: core
      artifact_name: ios-test-release-products
      production_build: ${{ github.event_name == 'workflow_dispatch' || inputs.production_build == true }}
  debug_products:
    name: Debug native products
    needs: plan
    uses: ./.github/workflows/ios-test-product-build.yml
    with:
      profile: provider-data
      artifact_name: ios-test-debug-products
  release_execution:
    name: General Release validation
    needs: [plan, release_products]
    uses: ./.github/workflows/ios-test-cohort-execution.yml
    with:
      cohort: release
      profile: core
      artifact_name: ios-test-release-products
      archive_digest: ${{ needs.release_products.outputs.archive_digest }}
      manifest_digest: ${{ needs.release_products.outputs.manifest_digest }}
      timeout_minutes: ${{ fromJSON(needs.plan.outputs.release_minutes) }}
  speech_execution:
    name: Authentic Korean Speech and UI validation
    needs: [plan, release_products]
    uses: ./.github/workflows/ios-test-cohort-execution.yml
    with:
      cohort: speech
      profile: speech
      artifact_name: ios-test-release-products
      archive_digest: ${{ needs.release_products.outputs.archive_digest }}
      manifest_digest: ${{ needs.release_products.outputs.manifest_digest }}
      timeout_minutes: ${{ fromJSON(needs.plan.outputs.speech_minutes) }}
  debug_execution:
    name: Debug provider and capability validation
    needs: [plan, debug_products]
    uses: ./.github/workflows/ios-test-cohort-execution.yml
    with:
      cohort: debug
      profile: provider-data
      artifact_name: ios-test-debug-products
      archive_digest: ${{ needs.debug_products.outputs.archive_digest }}
      manifest_digest: ${{ needs.debug_products.outputs.manifest_digest }}
      timeout_minutes: ${{ fromJSON(needs.plan.outputs.debug_minutes) }}
  completeness:
    name: Native test completeness
    needs: [release_products, debug_products, release_execution, speech_execution, debug_execution]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Require every build and execution boundary to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs=JSON.parse(process.env.RESULTS); if(Object.values(jobs).some(job=>job.result!=="success")) throw new Error("Incomplete native validation");'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-cohort-report-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native-reports/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-cohort-report-speech-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native-reports/speech
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-cohort-report-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native-reports/debug
      - name: Verify complete current-head native observations and authentic Speech
        run: |
          node scripts/ci/ios-test-cohort-results.mjs release artifacts/native-reports/release/results.json artifacts/native-reports/release-verified.json
          node scripts/ci/ios-test-cohort-results.mjs speech artifacts/native-reports/speech/results.json artifacts/native-reports/speech-verified.json
          node scripts/ci/ios-test-cohort-results.mjs debug artifacts/native-reports/debug/results.json artifacts/native-reports/debug-verified.json
          node scripts/ci/speech-test-evidence.mjs artifacts/native-reports/speech/speech-native/attachments artifacts/native-reports/speech-accuracy.json
