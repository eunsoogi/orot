name: iOS required statuses
on:
  workflow_call:
    inputs:
      selected: { required: true, type: boolean }
      invalid_selection: { required: true, type: boolean }
      execution_result: { required: true, type: string }
permissions: { contents: read }
jobs:
  status:
    # Each protected domain must report its own result even when another domain fails.
    name: ${{ matrix.check }}
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        check:
          - UI
          - Storage
          - Provider
          - Speech
          - Questions
    steps:
      - name: Reject diagnostic and incomplete selection
        env: { INVALID: '${{ inputs.invalid_selection }}' }
        run: test "$INVALID" = false
      - name: Require the full integration current-head gate when selected
        if: inputs.selected
        env: { RESULT: '${{ inputs.execution_result }}' }
        run: test "$RESULT" = success
      - name: Record a complete affected-path exclusion
        if: '!inputs.selected'
        run: echo 'The complete path selector did not select iOS validation.' >> "$GITHUB_STEP_SUMMARY"
