name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run reports the candidate; publish creates its exact-version tag and GitHub Release.
        type: choice
        options:
          - dry-run
          - publish
        default: dry-run
        required: true
      version:
        description: Stable MAJOR.MINOR.PATCH value matching the root and iOS app version; no v prefix.
        type: string
        required: true

permissions:
  actions: read
  contents: read

# Keep tag and release writes serialized across dispatches.
concurrency:
  group: orot-release-publication
  cancel-in-progress: false

jobs:
  verify:
    name: Release / Verify Candidate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      publication_allowed: ${{ steps.validate.outputs.publication_allowed }}
    steps:
      - name: Check out the selected main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Verify version, current main, and required main checks
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          OROT_RELEASE_MODE: ${{ inputs.mode }}
          OROT_VERSION: ${{ inputs.version }}
        run: node scripts/release/check.mjs

  publish:
    name: Release / Publish
    needs: verify
    if: ${{ inputs.mode == 'publish' && needs.verify.outputs.publication_allowed == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the verified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Revalidate and publish exact-version source release
        env:
          GH_TOKEN: ${{ github.token }}
          OROT_RELEASE_MODE: ${{ inputs.mode }}
          OROT_VERSION: ${{ inputs.version }}
        run: node scripts/release/publish.mjs
