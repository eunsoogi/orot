name: Native test validation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  EXPECTED_NODE_VERSION: '22.23.2'

jobs:
  native_products:
    name: Build native Release test products
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      archive_digest: ${{ steps.products.outputs.archive_digest }}
      manifest_digest: ${{ steps.products.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install workspace dependencies
        run: scripts/ci/run-command.sh native-dependencies artifacts/native/install.log -- pnpm install --frozen-lockfile
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '4.0.7'
          bundler-cache: false
      - name: Install pinned CocoaPods
        run: gem install cocoapods --version 1.17.0 --no-document
      - name: Prepare native dependencies
        run: scripts/ci/run-command.sh native-pods artifacts/native/pods.log -- pnpm --filter @orot/mobile ios:pods --deployment
      - name: Verify generated privacy metadata
        run: node scripts/ci/native-source-inputs.mjs
      - name: Build without booting a test simulator
        run: scripts/ci/run-command.sh native-build artifacts/native/build.log -- node scripts/ci/build-native-tests.mjs core artifacts/native/DerivedData
      - name: Package portable native test products
        id: products
        run: node scripts/ci/native-test-products.mjs create core artifacts/native/DerivedData/Build/Products artifacts/native/product-artifact
      - name: Upload native test products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-release-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native/product-artifact
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native/*.log
          if-no-files-found: warn
          retention-days: 7

  native_execution:
    name: Execute native ${{ matrix.profile }} tests
    needs: native_products
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [speech, core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install JS dependencies before test boot
        run: scripts/ci/run-command.sh native-dependencies artifacts/native/install.log -- pnpm install --frozen-lockfile
      - name: Download the producer's exact products
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-release-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native/product-artifact
      - name: Verify product provenance and integrity
        id: verify
        env:
          PROFILE: ${{ matrix.profile }}
          ARCHIVE_DIGEST: ${{ needs.native_products.outputs.archive_digest }}
          MANIFEST_DIGEST: ${{ needs.native_products.outputs.manifest_digest }}
        run: node scripts/ci/native-test-products.mjs verify "$PROFILE" artifacts/native/product-artifact "$ARCHIVE_DIGEST" "$MANIFEST_DIGEST"
      - name: Provision the pinned Speech runtime
        if: matrix.profile == 'speech'
        run: bash scripts/ci/prepare-native-runtime.sh speech
      - name: Boot the dedicated execution destination
        env:
          PROFILE: ${{ matrix.profile }}
        run: scripts/ci/run-command.sh native-simulator artifacts/native/simulator.log -- node scripts/ci/native-test-simulator.mjs prepare "$PROFILE" artifacts/native/simulator-owner.json
      - name: Execute without compilation or retry
        env:
          PROFILE: ${{ matrix.profile }}
          TEST_RUN: ${{ steps.verify.outputs.test_run }}
        run: |
          if [[ "$PROFILE" == core ]]; then
            selection=OrotUITests/NativeTestConnectionTests/testNativeTestHostLaunches
          else
            selection=''
          fi
          scripts/ci/run-command.sh native-tests artifacts/native/tests.log -- node scripts/ci/run-native-tests.mjs "$PROFILE" "$TEST_RUN" artifacts/native/simulator-owner.json artifacts/native/results.xcresult ${selection:+"$selection"}
          node scripts/ci/native-test-results.mjs "$PROFILE" artifacts/native/results.xcresult artifacts/native/results.json ${selection:+"$selection"}
      - name: Export native evidence attachments
        if: always()
        run: |
          if [[ -d artifacts/native/results.xcresult ]]; then
            xcrun xcresulttool export attachments --path artifacts/native/results.xcresult --output-path artifacts/native/attachments
          fi
      - name: Verify actual Korean Speech observations
        if: ${{ success() && matrix.profile == 'speech' }}
        run: node scripts/ci/native-speech-evidence.mjs artifacts/native/attachments artifacts/native/speech-accuracy.json
      - name: Tear down the owned destination
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          if [[ -f artifacts/native/simulator-owner.json ]]; then
            node scripts/ci/native-test-simulator.mjs cleanup "$PROFILE" artifacts/native/simulator-owner.json
          fi
      - name: Preserve native execution diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.profile }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/native/*.log
            artifacts/native/*.json
            artifacts/native/*.jsonl
            artifacts/native/*.xcresult
            artifacts/native/attachments
            artifacts/native/product-artifact/manifest.json
          if-no-files-found: warn
          retention-days: 7
