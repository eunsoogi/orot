name: Integration completeness
on:
  workflow_call:
    inputs:
      execution_results: { required: true, type: string }
      selected_cohorts: { required: true, type: string }
      oauth_required: { required: true, type: boolean }
      validation_tier: { required: true, type: string }
permissions: { contents: read }
jobs:
  completeness:
    name: Complete
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .nvmrc }
      - name: Require selection, selected producers and executors to succeed
        # Unselected configurations must be explicitly skipped; selection and selected work must succeed.
        env:
          OROT_IOS_EXECUTION_RESULTS: ${{ inputs.execution_results }}
          OROT_IOS_TEST_COHORTS: ${{ inputs.selected_cohorts }}
          OROT_IOS_OAUTH_TESTS: ${{ inputs.oauth_required }}
          OROT_IOS_VALIDATION_TIER: ${{ inputs.validation_tier }}
        run: node scripts/ci/ios-test-execution-completeness.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ios-cohort-report-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-reports
      - name: Download this attempt's Keychain authentication evidence
        if: ${{ inputs.validation_tier == 'full' || inputs.validation_tier == 'candidate' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-focused-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-authentication
      - name: Verify every planned first attempt and authentic Speech and Keychain evidence
        env:
          OROT_IOS_TEST_COHORTS: ${{ inputs.selected_cohorts }}
          OROT_IOS_OAUTH_TESTS: ${{ inputs.oauth_required }}
          OROT_IOS_VALIDATION_TIER: ${{ inputs.validation_tier }}
          OROT_IOS_AUTHENTICATION_EVIDENCE: ${{ (inputs.validation_tier == 'full' || inputs.validation_tier == 'candidate') && 'artifacts/ios-authentication' || '' }}
        run: node scripts/ci/ios-test-plan-results.mjs artifacts/ios-reports
      - name: Preserve verified selected results and explicit exclusions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-e2e-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-reports/complete.json
          if-no-files-found: error
