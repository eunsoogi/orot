name: Build reusable Detox Release app

on:
  workflow_call:
    inputs:
      fingerprints:
        description: Shared source and native dependency fingerprints for the caller's commit.
        required: true
        type: string
    outputs:
      artifact_name:
        description: Immutable artifact name for this run and attempt.
        value: ${{ jobs.produce_release_app.outputs.artifact_name }}
      archive_sha256:
        description: Digest of the verified Release app archive.
        value: ${{ jobs.produce_release_app.outputs.archive_sha256 }}
      manifest_sha256:
        description: Digest of the verified Release app manifest.
        value: ${{ jobs.produce_release_app.outputs.manifest_sha256 }}

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  EXPECTED_NODE_VERSION: '22.23.2'
  EXPECTED_PNPM_VERSION: '12.3.4'
  EXPECTED_RUBY_VERSION: '4.0.7'
  EXPECTED_COCOAPODS_VERSION: '1.17.0'
  EXPECTED_APPLESIMUTILS_VERSION: '0.9.12'
  EXPECTED_XCODE_VERSION: '27.0'
  EXPECTED_IOS_SIMULATOR_SDK: '27.0'
  EXPECTED_IOS_SIMULATOR_RUNTIME_NAME: iOS 27.0
  EXPECTED_IOS_SIMULATOR_RUNTIME_IDENTIFIER: com.apple.CoreSimulator.SimRuntime.iOS-27-0
  EXPECTED_DETOX_SIMULATOR_DEVICE_NAME: iPhone 18 Pro
  EXPECTED_DETOX_SIMULATOR_DEVICE_TYPE_ID: com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro

jobs:
  produce_release_app:
    name: Produce verified Release app artifact
    runs-on: xcode-27
    timeout-minutes: 75
    outputs:
      artifact_name: ${{ steps.artifact_name.outputs.name }}
      archive_sha256: ${{ steps.create_release_artifact.outputs.release_app_archive_sha256 }}
      manifest_sha256: ${{ steps.create_release_artifact.outputs.release_app_manifest_sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify runner toolchain
        id: verify_toolchain
        # Install the selected Simulator runtime before validating the custom runner image.
        timeout-minutes: 20
        run: bash scripts/ci/prepare-detox-runtime.sh release && scripts/ci/verify-toolchain.sh
      - name: Install dependencies and start build-input scan
        timeout-minutes: 15
        run: scripts/ci/run-command.sh install artifacts/detox/install.log -- scripts/ci/install-detox-profile-dependencies.sh release
      - name: Resolve shared cache fingerprints
        id: resolve_fingerprints
        env:
          DETOX_SHARED_FINGERPRINTS_JSON: ${{ inputs.fingerprints }}
        run: node scripts/ci/detox-cache-fingerprint-cli.mjs --resolve-shared-derived-data-only
      - name: Restore Release app product and Detox runtime cache
        id: profile_derived_data_cache
        timeout-minutes: 10
        uses: ./.github/actions/detox-profile-app-cache/restore
        with:
          profile: release
          fingerprints: ${{ steps.resolve_fingerprints.outputs.fingerprints }}
          key: orot-detox-app-product-v10-${{ runner.os }}-${{ runner.arch }}-macos-${{ steps.verify_toolchain.outputs.macos_version }}-node-${{ env.EXPECTED_NODE_VERSION }}-pnpm-${{ env.EXPECTED_PNPM_VERSION }}-ruby-${{ env.EXPECTED_RUBY_VERSION }}-cocoapods-${{ env.EXPECTED_COCOAPODS_VERSION }}-xcode-${{ env.EXPECTED_XCODE_VERSION }}-build-${{ steps.verify_toolchain.outputs.xcodebuild_fingerprint }}-sdk-${{ env.EXPECTED_IOS_SIMULATOR_SDK }}-release-native-${{ steps.resolve_fingerprints.outputs.native_dependencies }}-build-${{ steps.resolve_fingerprints.outputs.build_inputs }}
          restore_keys: >-
            orot-detox-app-product-v10-${{ runner.os }}-${{ runner.arch }}-macos-${{ steps.verify_toolchain.outputs.macos_version }}-node-${{ env.EXPECTED_NODE_VERSION }}-pnpm-${{ env.EXPECTED_PNPM_VERSION }}-ruby-${{ env.EXPECTED_RUBY_VERSION }}-cocoapods-${{ env.EXPECTED_COCOAPODS_VERSION }}-xcode-${{ env.EXPECTED_XCODE_VERSION }}-build-${{ steps.verify_toolchain.outputs.xcodebuild_fingerprint }}-sdk-${{ env.EXPECTED_IOS_SIMULATOR_SDK }}-release-native-${{ steps.resolve_fingerprints.outputs.native_dependencies }}-
      - name: Prepare restored Release DerivedData cache
        id: prepare_derived_data_cache
        timeout-minutes: 5
        env:
          DETOX_CACHE_RUNNER_OS: ${{ runner.os }}
          DETOX_CACHE_RUNNER_ARCH: ${{ runner.arch }}
          MACOS_VERSION: ${{ steps.verify_toolchain.outputs.macos_version }}
          EXPECTED_XCODE_VERSION: ${{ env.EXPECTED_XCODE_VERSION }}
          EXPECTED_IOS_SIMULATOR_SDK: ${{ env.EXPECTED_IOS_SIMULATOR_SDK }}
        run: node scripts/ci/detox-derived-data-cache.mjs prepare release
      - name: Cache Detox framework outputs
        id: detox_framework_cache
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        timeout-minutes: 10
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/Library/Detox/ios/framework
            ~/Library/Detox/ios/xcuitest-runner
          key: orot-detox-framework-v1-${{ runner.os }}-${{ runner.arch }}-macos-${{ steps.verify_toolchain.outputs.macos_version }}-xcode-${{ steps.verify_toolchain.outputs.xcodebuild_fingerprint }}-lock-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build Detox iOS framework cache
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' && steps.detox_framework_cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 20
        run: scripts/ci/run-command.sh detox-framework-cache artifacts/detox/framework-cache.log -- pnpm --filter @orot/mobile exec -- detox build-framework-cache
      - name: Prepare React Native artifact cache fingerprint
        id: rn_artifact_fingerprint
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        env:
          PNPM_LOCKFILE_HASH: ${{ hashFiles('pnpm-lock.yaml') }}
          PODFILE_LOCK_HASH: ${{ hashFiles('apps/mobile/ios/Podfile.lock') }}
        run: scripts/ci/prepare-rn-artifact-fingerprint.sh
      - name: Cache React Native artifact archives
        id: rn_artifact_cache
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        timeout-minutes: 10
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/ReactNative
          key: orot-rn-ios-artifacts-v3-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.EXPECTED_XCODE_VERSION }}-sdk-${{ env.EXPECTED_IOS_SIMULATOR_SDK }}-release-${{ steps.rn_artifact_fingerprint.outputs.fingerprint }}
      - name: Set up Ruby
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '4.0.7'
          bundler-cache: false
      - name: Cache Detox CocoaPods intermediates
        id: cocoapods_cache
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        uses: ./.github/actions/detox-cocoapods-cache
        with:
          cache-context: >-
            ${{ runner.os }}-${{ runner.arch }}-macos-${{ steps.verify_toolchain.outputs.macos_version }}-node-${{ env.EXPECTED_NODE_VERSION }}-pnpm-${{ env.EXPECTED_PNPM_VERSION }}-ruby-${{ env.EXPECTED_RUBY_VERSION }}-cocoapods-${{ env.EXPECTED_COCOAPODS_VERSION }}-xcode-${{ env.EXPECTED_XCODE_VERSION }}-sdk-${{ env.EXPECTED_IOS_SIMULATOR_SDK }}
      - name: Install CocoaPods
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        run: scripts/ci/run-command.sh cocoapods-install artifacts/detox/cocoapods-install.log -- gem install cocoapods --version "${EXPECTED_COCOAPODS_VERSION}" --no-document
      - name: Install Detox CocoaPods dependencies
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        timeout-minutes: 20
        run: bash scripts/ci/install-detox-cocoapods.sh
      - name: Build Release Detox app
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        timeout-minutes: 45
        run: scripts/ci/run-command.sh detox-build artifacts/detox/build.log -- bash scripts/ci/build-detox-apps.sh release --skip-pods
      - name: Write validated Release DerivedData cache manifest
        id: write_derived_data_cache
        if: ${{ steps.prepare_derived_data_cache.outputs.app_reusable != 'true' }}
        timeout-minutes: 5
        env:
          DETOX_CACHE_RUNNER_OS: ${{ runner.os }}
          DETOX_CACHE_RUNNER_ARCH: ${{ runner.arch }}
          EXPECTED_DETOX_BUILD_INPUT_FINGERPRINT: ${{ steps.profile_derived_data_cache.outputs.build_inputs }}
          EXPECTED_DETOX_NATIVE_DEPENDENCY_FINGERPRINT: ${{ steps.profile_derived_data_cache.outputs.native_dependencies }}
          EXPECTED_PRIVACY_MANIFEST_INPUT_SHA256: ${{ steps.profile_derived_data_cache.outputs.privacy_manifest_input_sha256 }}
          MACOS_VERSION: ${{ steps.verify_toolchain.outputs.macos_version }}
          EXPECTED_XCODE_VERSION: ${{ env.EXPECTED_XCODE_VERSION }}
          EXPECTED_IOS_SIMULATOR_SDK: ${{ env.EXPECTED_IOS_SIMULATOR_SDK }}
        run: node scripts/ci/detox-derived-data-cache.mjs write release
      - name: Save validated Release app product
        timeout-minutes: 10
        uses: ./.github/actions/detox-profile-app-cache/save
        with:
          profile: release
          key: ${{ steps.profile_derived_data_cache.outputs.cache-hit != 'true' && steps.write_derived_data_cache.outcome == 'success' && steps.profile_derived_data_cache.outputs.cache-primary-key || '' }}
      - name: Create run-bound Release app artifact
        id: create_release_artifact
        timeout-minutes: 15
        env:
          DETOX_CACHE_RUNNER_OS: ${{ runner.os }}
          DETOX_CACHE_RUNNER_ARCH: ${{ runner.arch }}
          XCODEBUILD_FINGERPRINT: ${{ steps.verify_toolchain.outputs.xcodebuild_fingerprint }}
          EXPECTED_DETOX_BUILD_INPUT_FINGERPRINT: ${{ steps.resolve_fingerprints.outputs.build_inputs }}
          EXPECTED_DETOX_NATIVE_DEPENDENCY_FINGERPRINT: ${{ steps.resolve_fingerprints.outputs.native_dependencies }}
          EXPECTED_XCODE_VERSION: ${{ env.EXPECTED_XCODE_VERSION }}
          EXPECTED_IOS_SIMULATOR_SDK: ${{ env.EXPECTED_IOS_SIMULATOR_SDK }}
        run: node scripts/ci/detox-release-app-artifact.mjs create artifacts/detox/release-app
      - name: Name run-bound Release artifact
        id: artifact_name
        env:
          RELEASE_APP_ARTIFACT_NAME: orot-detox-release-app-${{ github.run_id }}-${{ github.run_attempt }}
        run: echo "name=${RELEASE_APP_ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
      - name: Upload run-bound Release app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orot-detox-release-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/detox/release-app/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
