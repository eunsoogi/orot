name: Code Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep cancellation scoped to this workflow so parallel check sets do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  TZ: UTC
  EXPECTED_NODE_VERSION: '22.23.2'
  EXPECTED_PNPM_VERSION: '12.3.4'
  EXPECTED_RUBY_VERSION: '4.0.7'
  EXPECTED_LINUX_ARCH: x86_64

jobs:
  inventory:
    name: Maintained file inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      selection_complete: ${{ steps.select.outputs.selection_complete }}
      quality_inventory: ${{ steps.select.outputs.quality_inventory }}
      source_loc: ${{ steps.select.outputs.source_loc }}
      format_check: ${{ steps.select.outputs.format_check }}
      javascript: ${{ steps.select.outputs.javascript }}
      typescript: ${{ steps.select.outputs.typescript }}
      swift: ${{ steps.select.outputs.swift }}
      objective_c: ${{ steps.select.outputs.objective_c }}
      shell: ${{ steps.select.outputs.shell }}
      ruby: ${{ steps.select.outputs.ruby }}
      yaml: ${{ steps.select.outputs.yaml }}
      json: ${{ steps.select.outputs.json }}
      xml: ${{ steps.select.outputs.xml }}
      properties: ${{ steps.select.outputs.properties }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      # This required check owns path selection so selector failures remain visible to branch protection.
      - name: Select checks for changed paths
        id: select
        run: node scripts/ci/select-changed-paths.mjs

      - name: Record maintained code inventory
        if: ${{ steps.select.outputs.quality_inventory == 'true' }}
        run: scripts/ci/run-command.sh quality-inventory artifacts/quality/quality-inventory.log -- pnpm quality:inventory

      - name: Upload inventory log
        if: ${{ always() && steps.select.outputs.quality_inventory == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-quality-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality/
          if-no-files-found: error
          retention-days: 14

  source_loc:
    name: Source LOC policy
    needs: inventory
    # No completion marker means selection failed; run every downstream quality leaf.
    if: ${{ always() && !cancelled() && (needs.inventory.outputs.selection_complete != 'true' || needs.inventory.outputs.source_loc == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Check canonical source line policy
        shell: bash
        # PR uses its target base; push uses the event's before SHA instead of comparing HEAD with itself.
        env:
          LOC_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            scripts/ci/run-command.sh source-loc artifacts/quality/source-loc.log -- node scripts/ci/check-loc.mjs --all
          else
            scripts/ci/run-command.sh source-loc artifacts/quality/source-loc.log -- node scripts/ci/check-loc.mjs --base "$LOC_BASE_SHA"
          fi

      - name: Upload source LOC log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-source-loc-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality/
          if-no-files-found: error
          retention-days: 14

  lint_javascript:
    name: Lint / JavaScript
    needs: inventory
    if: ${{ always() && !cancelled() && (needs.inventory.outputs.selection_complete != 'true' || needs.inventory.outputs.javascript == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      # The runner must check out local action files before resolving the composite step below.
      - &quality_checkout
        name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: ./.github/actions/run-quality-surface
        with: { surface: javascript }

  lint_typescript:
    name: Lint / TypeScript
    needs: inventory
    if: ${{ always() && !cancelled() && (needs.inventory.outputs.selection_complete != 'true' || needs.inventory.outputs.typescript == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - *quality_checkout
      - uses: ./.github/actions/run-quality-surface
        with: { surface: typescript }

  lint_swift:
    name: Lint / Swift
    needs: inventory
    if: ${{ always() && !cancelled() && (needs.inventory.outputs.selection_complete != 'true' || needs.inventory.outputs.swift == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - *quality_checkout
      - uses: ./.github/actions/run-quality-surface
        with: { surface: swift }

  lint_objective_c:
    name: Lint / Objective-C
    needs: inventory
    if: ${{ always() && !cancelled() && (needs.inventory.outputs.selection_complete != 'true' || needs.inventory.outputs.objective_c == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - *quality_checkout
      - uses: ./.github/actions/run-quality-surface
        with: { surface: objective-c }

  lint_shell:
    name: Lint / Shell
    needs: inventory
    if: ${{ always() && !cancelled() && (needs.inventory.outputs.selection_complete != 'true' || needs.inventory.outputs.shell == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - *quality_checkout
      - uses: ./.github/actions/run-quality-surface
        with: { surface: shell }

  lint_ruby:
    name: Lint / Ruby
    needs: inventory
    if: ${{ always() && !cancelled() && (needs.inventory.outputs.selection_complete != 'true' || needs.inventory.outputs.ruby == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - *quality_checkout
      - uses: ./.github/actions/run-quality-surface
        with: { surface: ruby }

  lint_yaml:
    name: Lint / YAML
    needs: inventory
    if: ${{ always() && !cancelled() && (needs.inventory.outputs.selection_complete != 'true' || needs.inventory.outputs.yaml == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - *quality_checkout
      - uses: ./.github/actions/run-quality-surface
        with: { surface: yaml }

  lint_json:
    name: Lint / JSON
    needs: inventory
    if: ${{ always() && !cancelled() && (needs.inventory.outputs.selection_complete != 'true' || needs.inventory.outputs.json == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - *quality_checkout
      - uses: ./.github/actions/run-quality-surface
        with: { surface: json }

  lint_xml:
    name: Lint / XML
    needs: inventory
    if: ${{ always() && !cancelled() && (needs.inventory.outputs.selection_complete != 'true' || needs.inventory.outputs.xml == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - *quality_checkout
      - uses: ./.github/actions/run-quality-surface
        with: { surface: xml }

  lint_properties:
    name: Lint / Properties
    needs: inventory
    if: ${{ always() && !cancelled() && (needs.inventory.outputs.selection_complete != 'true' || needs.inventory.outputs.properties == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - *quality_checkout
      - uses: ./.github/actions/run-quality-surface
        with: { surface: properties }

  format_check:
    name: Format check
    needs: inventory
    if: ${{ always() && !cancelled() && (needs.inventory.outputs.selection_complete != 'true' || needs.inventory.outputs.format_check == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - *quality_checkout
      - uses: ./.github/actions/run-quality-surface
        with: { mode: format }
