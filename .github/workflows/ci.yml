name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TZ: UTC
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  EXPECTED_NODE_VERSION: "22.23.2"
  EXPECTED_PNPM_VERSION: "12.3.4"
  EXPECTED_RUBY_VERSION: "4.0.7"
  EXPECTED_COCOAPODS_VERSION: "1.17.0"
  EXPECTED_MACOS_VERSION: "27.0"
  EXPECTED_XCODE_VERSION: "27.0"
  EXPECTED_IOS_SIMULATOR_SDK: "27.0"

jobs:
  quality:
    name: CI / Quality
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify runner toolchain
        run: scripts/ci/verify-toolchain.sh

      - name: Install frozen workspace dependencies
        run: scripts/ci/run-command.sh install artifacts/quality/install.log -- pnpm install --frozen-lockfile

      - name: Test CI and release gate rules
        run: scripts/ci/run-command.sh gate-tests artifacts/quality/gate-tests.log -- node --test scripts/ci/tests/*.test.mjs scripts/release/tests/validate.test.mjs

      - name: Lint
        run: scripts/ci/run-command.sh lint artifacts/quality/lint.log -- pnpm lint

      - name: Type check
        run: scripts/ci/run-command.sh typecheck artifacts/quality/typecheck.log -- pnpm typecheck

      - name: Run unit and component tests
        run: scripts/ci/run-test-suite.sh unit artifacts/quality

      - name: Upload quality logs and test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality/
          if-no-files-found: error
          retention-days: 14

  ios-simulator-build:
    name: CI / iOS Simulator Build
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: "4.0.7"
          bundler-cache: false

      - name: Install CocoaPods
        run: |
          scripts/ci/run-command.sh cocoapods-install artifacts/ios-build/cocoapods-install.log -- gem install cocoapods --version "${EXPECTED_COCOAPODS_VERSION}" --no-document

      - name: Verify runner toolchain
        run: scripts/ci/verify-toolchain.sh --cocoapods

      - name: Install frozen workspace dependencies
        run: scripts/ci/run-command.sh install artifacts/ios-build/install.log -- pnpm install --frozen-lockfile

      - name: Build the iOS Simulator app
        run: scripts/ci/run-command.sh ios-simulator-build artifacts/ios-build/build.log -- pnpm ios:build

      - name: Upload iOS build log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-ios-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-build/
          if-no-files-found: error
          retention-days: 14

  detox-ios-e2e:
    name: CI / Detox iOS E2E
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: "4.0.7"
          bundler-cache: false

      - name: Install CocoaPods
        run: |
          scripts/ci/run-command.sh cocoapods-install artifacts/detox/cocoapods-install.log -- gem install cocoapods --version "${EXPECTED_COCOAPODS_VERSION}" --no-document

      - name: Verify runner toolchain
        run: scripts/ci/verify-toolchain.sh --cocoapods

      - name: Install frozen workspace dependencies
        run: scripts/ci/run-command.sh install artifacts/detox/install.log -- pnpm install --frozen-lockfile

      - name: Build Detox iOS Simulator app
        run: scripts/ci/run-command.sh detox-build artifacts/detox/build.log -- pnpm e2e:build:ios

      - name: Run Detox iOS Simulator tests
        run: scripts/ci/run-test-suite.sh e2e artifacts/detox

      - name: Collect simulator logs
        if: ${{ always() }}
        run: scripts/ci/collect-simulator-diagnostics.sh artifacts/detox/e2e-test.log artifacts/detox/simulator.log

      - name: Upload Detox reports, logs, screenshots, and videos
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-detox-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/detox/
          if-no-files-found: error
          retention-days: 14
