name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      detox_trace:
        description: Emit Detox lifecycle and device-call traces for diagnosis.
        required: false
        type: boolean
        default: false
      detox_resource_sampling:
        description: Collect bounded process and memory samples for diagnosis.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  TZ: UTC
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  EXPECTED_NODE_VERSION: '22.23.2'
  EXPECTED_PNPM_VERSION: '12.3.4'
  EXPECTED_RUBY_VERSION: '4.0.7'
  EXPECTED_COCOAPODS_VERSION: '1.17.0'
  EXPECTED_APPLESIMUTILS_VERSION: '0.9.12'
  EXPECTED_MACOS_VERSION: '27.0'
  EXPECTED_XCODE_VERSION: '27.0'
  EXPECTED_IOS_SIMULATOR_SDK: '27.0'

jobs:
  quality:
    name: Quality
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enforce the 250-line policy
        env:
          LOC_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            node scripts/ci/check-loc.mjs --all
          else
            node scripts/ci/check-loc.mjs --base "$LOC_BASE_SHA"
          fi

      - name: Verify runner toolchain
        run: scripts/ci/verify-toolchain.sh

      - name: Install frozen workspace dependencies
        run: scripts/ci/run-command.sh install artifacts/quality/install.log -- pnpm install --frozen-lockfile

      - name: Install pinned quality tools
        run: scripts/ci/run-command.sh quality-tools-install artifacts/quality/quality-tools-install.log -- pnpm quality:setup

      - name: Record maintained code inventory
        run: scripts/ci/run-command.sh quality-inventory artifacts/quality/quality-inventory.log -- pnpm quality:inventory

      - name: Test CI and release gate rules
        run: scripts/ci/run-command.sh gate-tests artifacts/quality/gate-tests.log -- node --test scripts/ci/tests/*.test.mjs scripts/release/tests/*.test.mjs scripts/quality/tests/*.test.mjs

      - name: Lint
        run: scripts/ci/run-command.sh lint artifacts/quality/lint.log -- pnpm lint

      - name: Check formatting
        run: scripts/ci/run-command.sh format artifacts/quality/format.log -- pnpm format:check

      - name: Type check
        run: scripts/ci/run-command.sh typecheck artifacts/quality/typecheck.log -- pnpm typecheck

      - name: Run unit and component tests
        run: scripts/ci/run-test-suite.sh unit artifacts/quality

      - name: Upload quality logs and test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality/
          if-no-files-found: error
          retention-days: 14

  ios-simulator-build:
    name: iOS Simulator Build
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '4.0.7'
          bundler-cache: false
      - name: Install CocoaPods
        run: |
          scripts/ci/run-command.sh cocoapods-install artifacts/ios-build/cocoapods-install.log -- gem install cocoapods --version "${EXPECTED_COCOAPODS_VERSION}" --no-document
      - name: Verify runner toolchain
        run: scripts/ci/verify-toolchain.sh --cocoapods
      - name: Install frozen workspace dependencies
        run: scripts/ci/run-command.sh install artifacts/ios-build/install.log -- pnpm install --frozen-lockfile
      - name: Compute production app cache fingerprints
        id: production_app_fingerprint
        run: node scripts/ci/detox-cache-fingerprint-cli.mjs --derived-data-only
      - name: Cache production app DerivedData
        id: production_app_cache
        timeout-minutes: 10
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/mobile/ios/build-production
          key: orot-ios-app-deriveddata-v2-${{ runner.os }}-${{ runner.arch }}-macos-${{ env.EXPECTED_MACOS_VERSION }}-node-${{ env.EXPECTED_NODE_VERSION }}-pnpm-${{ env.EXPECTED_PNPM_VERSION }}-ruby-${{ env.EXPECTED_RUBY_VERSION }}-cocoapods-${{ env.EXPECTED_COCOAPODS_VERSION }}-xcode-${{ env.EXPECTED_XCODE_VERSION }}-sdk-${{ env.EXPECTED_IOS_SIMULATOR_SDK }}-production-native-${{ steps.production_app_fingerprint.outputs.native_dependencies }}-build-${{ steps.production_app_fingerprint.outputs.build_inputs }}
          restore-keys: |
            orot-ios-app-deriveddata-v2-${{ runner.os }}-${{ runner.arch }}-macos-${{ env.EXPECTED_MACOS_VERSION }}-node-${{ env.EXPECTED_NODE_VERSION }}-pnpm-${{ env.EXPECTED_PNPM_VERSION }}-ruby-${{ env.EXPECTED_RUBY_VERSION }}-cocoapods-${{ env.EXPECTED_COCOAPODS_VERSION }}-xcode-${{ env.EXPECTED_XCODE_VERSION }}-sdk-${{ env.EXPECTED_IOS_SIMULATOR_SDK }}-production-native-${{ steps.production_app_fingerprint.outputs.native_dependencies }}-
      - name: Prepare production app DerivedData cache
        id: prepare_production_app_cache
        env:
          DETOX_CACHE_RUNNER_OS: ${{ runner.os }}
          DETOX_CACHE_RUNNER_ARCH: ${{ runner.arch }}
          EXPECTED_XCODE_VERSION: ${{ env.EXPECTED_XCODE_VERSION }}
          EXPECTED_IOS_SIMULATOR_SDK: ${{ env.EXPECTED_IOS_SIMULATOR_SDK }}
          APP_CACHE_HIT: ${{ steps.production_app_cache.outputs.cache-hit }}
        run: |
          mkdir -p artifacts/ios-build
          set -o pipefail; node scripts/ci/detox-derived-data-cache.mjs prepare production 2>&1 | tee artifacts/ios-build/native-cache.log
          printf 'derived_data_cache_hit=%s\n' "${APP_CACHE_HIT:-false}" >> artifacts/ios-build/native-cache.log
      - name: Install app CocoaPods dependencies
        if: ${{ steps.prepare_production_app_cache.outputs.app_reusable != 'true' }}
        run: scripts/ci/run-command.sh app-pods artifacts/ios-build/pods-install.log -- bash scripts/ci/build-ios-simulator-app.sh pods

      - name: Build the iOS Simulator app
        if: ${{ steps.prepare_production_app_cache.outputs.app_reusable != 'true' }}
        run: scripts/ci/run-command.sh ios-simulator-build artifacts/ios-build/build.log -- bash scripts/ci/build-ios-simulator-app.sh build

      - name: Write production app DerivedData manifest
        if: ${{ steps.prepare_production_app_cache.outputs.app_reusable != 'true' }}
        env:
          DETOX_CACHE_RUNNER_OS: ${{ runner.os }}
          DETOX_CACHE_RUNNER_ARCH: ${{ runner.arch }}
          EXPECTED_DETOX_BUILD_INPUT_FINGERPRINT: ${{ steps.production_app_fingerprint.outputs.build_inputs }}
          EXPECTED_DETOX_NATIVE_DEPENDENCY_FINGERPRINT: ${{ steps.production_app_fingerprint.outputs.native_dependencies }}
          EXPECTED_PRIVACY_MANIFEST_INPUT_SHA256: ${{ steps.production_app_fingerprint.outputs.privacy_manifest_input_sha256 }}
          EXPECTED_XCODE_VERSION: ${{ env.EXPECTED_XCODE_VERSION }}
          EXPECTED_IOS_SIMULATOR_SDK: ${{ env.EXPECTED_IOS_SIMULATOR_SDK }}
        run: set -o pipefail; node scripts/ci/detox-derived-data-cache.mjs write production 2>&1 | tee -a artifacts/ios-build/native-cache.log

      - name: Test the standalone ChatGPT OAuth package
        run: scripts/ci/run-command.sh openai-oauth-tests artifacts/ios-build/openai-oauth-tests.log -- swift test --package-path packages/provider-openai

      - name: Build the standalone ChatGPT OAuth Simulator harness
        run: |
          scripts/ci/run-command.sh openai-oauth-ios-build artifacts/ios-build/openai-oauth-ios-build.log -- xcodebuild \
            -project packages/provider-openai/ios-spike/ChatGPTOAuthSpike.xcodeproj \
            -scheme ChatGPTOAuthSpike \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/orot-openai-oauth-derived" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload iOS build log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-ios-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-build/
          if-no-files-found: error
          retention-days: 14

  detox_release_e2e:
    name: Detox Release iOS E2E
    uses: ./.github/workflows/detox-e2e-profile.yml
    with:
      profile: release
      trace_logging: ${{ github.event_name == 'workflow_dispatch' && inputs.detox_trace == true }}
      resource_sampling: ${{ github.event_name == 'workflow_dispatch' && inputs.detox_resource_sampling == true }}

  detox_openai_provider_e2e:
    name: Detox OpenAI Debug iOS E2E
    uses: ./.github/workflows/detox-e2e-profile.yml
    with:
      profile: openai-provider
      trace_logging: ${{ github.event_name == 'workflow_dispatch' && inputs.detox_trace == true }}
      resource_sampling: ${{ github.event_name == 'workflow_dispatch' && inputs.detox_resource_sampling == true }}

  detox_ios_e2e:
    name: Detox iOS E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detox_release_e2e, detox_openai_provider_e2e]
    if: ${{ always() }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require both child jobs and full E2E coverage
        env:
          RELEASE_JOB_RESULT: ${{ needs.detox_release_e2e.result }}
          RELEASE_PROFILE: ${{ needs.detox_release_e2e.outputs.profile }}
          RELEASE_TEST_CASES: ${{ needs.detox_release_e2e.outputs.test_cases }}
          RELEASE_TEST_SUITES: ${{ needs.detox_release_e2e.outputs.test_suites }}
          OPENAI_JOB_RESULT: ${{ needs.detox_openai_provider_e2e.result }}
          OPENAI_PROFILE: ${{ needs.detox_openai_provider_e2e.outputs.profile }}
          OPENAI_TEST_CASES: ${{ needs.detox_openai_provider_e2e.outputs.test_cases }}
          OPENAI_TEST_SUITES: ${{ needs.detox_openai_provider_e2e.outputs.test_suites }}
        run: |
          node scripts/ci/require-detox-e2e-aggregate.mjs \
            "$RELEASE_JOB_RESULT" "$RELEASE_PROFILE" "$RELEASE_TEST_CASES" "$RELEASE_TEST_SUITES" \
            "$OPENAI_JOB_RESULT" "$OPENAI_PROFILE" "$OPENAI_TEST_CASES" "$OPENAI_TEST_SUITES"
