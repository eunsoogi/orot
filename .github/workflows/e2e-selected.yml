name: E2E Test - Selected

on:
  workflow_dispatch:
    inputs:
      focus_pr_number:
        description: Optional open PR number whose repository, branch and head must match this run.
        type: string
        default: ''
      focus_profile:
        description: Exact ios/<profile> selection.
        type: string
        required: true
      focus_scenario_file:
        description: Repository path to the selected test source or complete phase driver.
        type: string
        required: true
      focus_scenario_name:
        description: Exact XCTest identifier or supported complete group.
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read

# Share the full workflow's queued allocation window without creating protected checks.
concurrency:
  group: ios-ci-macos-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  selected:
    name: iOS
    uses: ./.github/workflows/ios-focused.yml
    with:
      pr_number: ${{ inputs.focus_pr_number }}
      profile: ${{ inputs.focus_profile }}
      scenario_file: ${{ inputs.focus_scenario_file }}
      scenario_name: ${{ inputs.focus_scenario_name }}
