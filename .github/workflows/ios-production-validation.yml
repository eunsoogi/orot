name: Production build

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  EXPECTED_NODE_VERSION: '22.23.2'

jobs:
  validation:
    name: Production
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: ./.github/actions/ios-production-validation
      - name: Preserve the production receipt independently of test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-production-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-focus/production-receipt.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve the first production failure and build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-production-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios-focus/*.log
          if-no-files-found: warn
          retention-days: 7
