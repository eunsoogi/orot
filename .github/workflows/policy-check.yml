name: Policy Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep cancellation scoped to this workflow so parallel check sets do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  TZ: UTC
  EXPECTED_NODE_VERSION: '22.23.2'
  EXPECTED_PNPM_VERSION: '12.3.4'
  EXPECTED_RUBY_VERSION: '4.0.7'

jobs:
  # Keep CI, release, and quality-contract failures in their own required check.
  gate_tests:
    name: CI, release, and quality gate tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache pnpm lockfile verification
        uses: ./.github/actions/pnpm-lockfile-verification
        with:
          pnpm-version: ${{ env.EXPECTED_PNPM_VERSION }}

      # CocoaPods diagnostic fixtures need the same Ruby version as Code Quality.
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: ${{ env.EXPECTED_RUBY_VERSION }}
          bundler-cache: false

      - name: Install frozen workspace dependencies
        # Inventory tests scan the checkout, so keep their generated logs in runner temp.
        run: scripts/ci/run-command.sh install "$RUNNER_TEMP/orot-gate-tests/install.log" -- pnpm install --frozen-lockfile

      - name: Run CI, release, and quality gate tests
        run: scripts/ci/run-command.sh gate-tests "$RUNNER_TEMP/orot-gate-tests/gate-tests.log" -- node --test scripts/ci/tests/*.test.mjs scripts/release/tests/*.test.mjs scripts/quality/tests/*.test.mjs

      - name: Upload policy test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-policy-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orot-gate-tests/
          if-no-files-found: error
          retention-days: 14
