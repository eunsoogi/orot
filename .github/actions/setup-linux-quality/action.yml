name: Set up Linux quality tools
description: Install the pinned workspace and quality-toolchain used by CI quality leaves.
inputs:
  pnpm_version:
    description: Pinned workspace package-manager version.
    required: true
  ruby_version:
    description: Pinned Ruby version for quality tooling.
    required: true
runs:
  using: composite
  steps:
    # Share one pinned install sequence across independently named Linux quality leaves.
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: ${{ inputs.pnpm_version }}
        run_install: false
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Cache pnpm lockfile verification
      uses: ./.github/actions/pnpm-lockfile-verification
      with:
        pnpm-version: ${{ inputs.pnpm_version }}
    - name: Set up Ruby
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
      with:
        ruby-version: ${{ inputs.ruby_version }}
        bundler-cache: false
    - name: Verify Linux portable toolchain
      shell: bash
      env:
        EXPECTED_PNPM_VERSION: ${{ inputs.pnpm_version }}
        EXPECTED_RUBY_VERSION: ${{ inputs.ruby_version }}
      run: scripts/ci/verify-toolchain.sh --portable
    - name: Install frozen workspace dependencies
      shell: bash
      run: scripts/ci/run-command.sh install artifacts/quality/install.log -- pnpm install --frozen-lockfile
    - name: Cache pinned quality tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: node_modules/.cache/orot-quality
        key: orot-quality-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/quality/tool-versions.json') }}
    - name: Install pinned quality tools
      shell: bash
      env:
        EXPECTED_PNPM_VERSION: ${{ inputs.pnpm_version }}
        EXPECTED_RUBY_VERSION: ${{ inputs.ruby_version }}
      run: scripts/ci/run-command.sh quality-tools-install artifacts/quality/quality-tools-install.log -- pnpm quality:setup -- --platform linux
