name: Require this host's Apple Intelligence prerequisites
description: Bound public host diagnosis before dependencies, compilation or Simulator work; native generation remains required.
inputs:
  evidence:
    description: Directory retaining the original host observations for this executor.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: .nvmrc
    - name: Observe resources before host diagnosis
      shell: bash
      env:
        EVIDENCE: ${{ inputs.evidence }}
      run: node scripts/ci/ios-test-resources.mjs "$EVIDENCE/apple-model-resources.jsonl" before-host-diagnosis
    - name: Record public Apple model host preparation
      shell: bash
      env:
        EVIDENCE: ${{ inputs.evidence }}
      run: scripts/ci/run-command.sh native-model-host "$EVIDENCE/apple-model-host.log" -- xcrun swift -swift-version 6 scripts/ci/prepare-apple-model-host.swift
    - name: Record the public on-device Apple model CLI diagnostic
      # Collect the distinct CLI discriminator even if Swift failed; it cannot erase that failure.
      if: ${{ !cancelled() }}
      shell: bash
      env:
        EVIDENCE: ${{ inputs.evidence }}
      run: scripts/ci/run-command.sh native-model-cli "$EVIDENCE/apple-model-cli.log" -- node scripts/ci/probe-apple-model-cli.mjs
    - name: Observe resources after host diagnosis
      if: ${{ !cancelled() }}
      shell: bash
      env:
        EVIDENCE: ${{ inputs.evidence }}
      run: node scripts/ci/ios-test-resources.mjs "$EVIDENCE/apple-model-resources.jsonl" after-host-diagnosis
    - name: Require supported Apple Intelligence before costly work
      if: ${{ !cancelled() }}
      shell: bash
      env:
        EVIDENCE: ${{ inputs.evidence }}
      run: node scripts/ci/verify-apple-model-host.mjs "$EVIDENCE/apple-model-host.log"
