name: Prepare pinned native build tools
description: Install the pinned JavaScript and Ruby tools once on each native build host.
runs:
  using: composite
  steps:
    # The calling workflow exposes host bootstrap immediately after checkout.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: 12.3.4
        run_install: false
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Cache pnpm lockfile verification
      uses: ./.github/actions/pnpm-lockfile-verification
    - name: Install frozen workspace dependencies
      shell: bash
      run: scripts/ci/run-command.sh ios-focus-dependencies artifacts/ios-focus/install.log -- pnpm install --frozen-lockfile
    - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
      with:
        ruby-version: '4.0.7'
        bundler-cache: false
    - name: Install pinned CocoaPods
      shell: bash
      run: gem install cocoapods --version 1.17.0 --no-document
