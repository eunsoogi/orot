name: Build portable native test products
description: Prepare native dependencies and build verified test products without booting a Simulator.
inputs:
  profile:
    description: Validated native execution profile selecting its compatible build specification.
    required: true
outputs:
  archive_digest:
    description: SHA-256 of the portable native product archive.
    value: ${{ steps.products.outputs.archive_digest }}
  manifest_digest:
    description: SHA-256 of the source and product provenance manifest.
    value: ${{ steps.products.outputs.manifest_digest }}
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: 12.3.4
        run_install: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install frozen workspace dependencies
      shell: bash
      run: scripts/ci/run-command.sh native-focus-dependencies artifacts/native-focus/install.log -- pnpm install --frozen-lockfile
    - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
      with:
        ruby-version: '4.0.7'
        bundler-cache: false
    - name: Install pinned CocoaPods
      shell: bash
      run: gem install cocoapods --version 1.17.0 --no-document
    - name: Prepare native dependencies
      shell: bash
      run: scripts/ci/run-command.sh native-focus-pods artifacts/native-focus/pods.log -- pnpm --filter @orot/mobile ios:pods --deployment
    - name: Verify generated privacy metadata
      shell: bash
      run: node scripts/ci/ios-test-source-inputs.mjs
    - name: Build without booting a Simulator
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: scripts/ci/run-command.sh native-focus-build artifacts/native-focus/build.log -- node scripts/ci/build-ios-tests.mjs "$PROFILE" artifacts/native-focus/DerivedData
    - name: Package portable test products
      id: products
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: scripts/ci/run-command.sh native-focus-products artifacts/native-focus/products.log -- node scripts/ci/ios-test-products.mjs create "$PROFILE" artifacts/native-focus/DerivedData/Build/Products artifacts/native-focus/product-artifact
