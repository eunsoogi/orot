name: Collect and clean Detox diagnostics
description: Capture simulator logs, remove the dedicated simulator, and upload profile artifacts.
inputs:
  profile:
    description: Detox profile name.
    required: true
  release_shard:
    description: Release shard used to keep parallel artifacts separate.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # Test failures still require simulator teardown and diagnostic upload.
    - name: Collect simulator logs
      if: ${{ always() }}
      shell: bash
      run: scripts/ci/collect-simulator-diagnostics.sh artifacts/detox/e2e-test.log artifacts/detox/simulator.log artifacts/detox/simulator.udid "${{ inputs.profile }}" artifacts/detox/simulator-baseline.json artifacts/detox/simulator-targets.txt
    - name: Delete dedicated Detox Simulator
      if: ${{ always() }}
      shell: bash
      run: scripts/ci/run-command.sh detox-simulator-teardown artifacts/detox/simulator-teardown.log -- bash scripts/ci/teardown-detox-simulator.sh --identity-file artifacts/detox/simulator.udid artifacts/detox/simulator-teardown-details.log artifacts/detox/simulator-targets.txt artifacts/detox/release-worker-simulators.txt
    - name: Upload Detox reports, logs, screenshots, and videos
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        # Parallel Release runners need separate artifacts so each keeps its own diagnostics.
        name: ci-detox-${{ inputs.profile }}${{ inputs.release_shard != '' && format('-{0}', inputs.release_shard) || '' }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/detox/
        if-no-files-found: error
        retention-days: 14
